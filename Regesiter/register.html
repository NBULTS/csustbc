<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#287ee3">
    <title>报名协会运营 · 长理羽协</title>
    <style>
        /* 引入本地字体 */
        @font-face {
            font-family: "MyFont";
            src: url("../zh-cn.woff2") format("woff2"),
                 url("../zh-cn-subset.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;               /* 禁止页面滚动 */
            font-family: "MyFont", "Microsoft YaHei", Arial, sans-serif;
        }

        /* ================= 关键帧动画 ================= */

        /* 上层 SVG 区域淡入 */
        @keyframes heroFade {
            from { opacity: 0; transform: scale(1.04) translateZ(0); }
            to   { opacity: 1; transform: scale(1)    translateZ(0); }
        }

        /* 下层整体从下方滑入 */
        @keyframes slideUp {
            from { transform: translateY(60px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* 入口卡片错落出现 */
        @keyframes cardIn {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* 页面容器：使用动态视口高度适配移动端地址栏 */
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ================= 上层：占 60% 高度，背景图 ================= */

        .hero {
            position: relative;
            height: 60%;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #287ee3;            /* 背景图未加载时的兜底背景色 */
            animation: heroFade 1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* 背景图：铺满整个上层区域 */
        .hero svg,
        .hero object,
        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;           /* 上层仅作展示 */
        }
        /* picture 容器：铺满上层 */
        .hero picture {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 顶层标题文字 */
        .hero-title {
            position: absolute;
            top: 24px;
            left: 32px;
            z-index: 2;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-shadow: 0 3px 14px rgba(0, 0, 0, 0.55);
        }

        /* 返回按钮 */
        .back-btn {
            position: absolute;
            top: 24px;
            right: 32px;
            z-index: 3;
            padding: 10px 20px;
            font-size: 1rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            user-select: none;
            transition: background 0.25s ease, padding-right 0.25s ease;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.6);
            padding-right: 26px;
        }

        /* ================= 下层：占 40% 高度，下载报名表按钮 ================= */

        .entries {
            height: 40%;
            background: #287ee3;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            padding: 32px 40px;
            animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        /* 下载报名表按钮：直角风格 */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-width: 360px;
            padding: 24px 48px;
            font-size: 1.7rem;
            font-weight: bold;
            font-family: inherit;
            color: #287ee3;
            background: #ffffff;
            border: 2px solid #d0d7de;
            border-radius: 0;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
        }

        .download-btn:hover {
            transform: translateY(-6px);
            border-color: #4facfe;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .download-btn .download-icon {
            font-size: 1.8rem;
        }

        /* ================================================================
           移动端适配（手机竖屏 / 横屏 / 触屏）
           ================================================================ */

        body { -webkit-tap-highlight-color: transparent; }

        /* 触屏：去掉 hover 位移，避免点击残留 */
        @media (hover: none) {
            .back-btn:hover { padding-right: 20px; background: rgba(0, 0, 0, 0.35); }
            .download-btn:hover { transform: none; box-shadow: none; border-color: #d0d7de; }
        }

        /* 平板 / 窄桌面 */
        @media (max-width: 720px) {
            .hero-title { font-size: 1.5rem; top: 16px; left: 16px; }
            .back-btn   { top: 16px; right: 16px; padding: 8px 14px; font-size: 0.9rem; }
            .entries    { padding: 20px; }
            .download-btn { min-width: 0; width: 100%; font-size: 1.4rem; padding: 20px 24px; }
        }

        /* 手机竖屏：标题与返回按钮上下错开，避免窄屏挤压重叠 */
        @media (max-width: 480px) {
            .hero { height: 52%; }
            .entries { height: 48%; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }

            /* 标题换到第二行，整体左对齐铺开 */
            .hero-title {
                top: 12px;
                left: 14px;
                right: 14px;
                font-size: 1.25rem;
                letter-spacing: 0.06em;
            }
            /* 返回按钮移到标题下方，避免与标题同行拥挤 */
            .back-btn {
                top: 52px;
                right: 14px;
                padding: 7px 12px;
                font-size: 0.82rem;
            }

            .download-btn {
                width: 100%;
                font-size: 1.2rem;
                padding: 18px 16px;
                gap: 10px;
            }
            .download-btn .download-icon { font-size: 1.4rem; }
        }

        /* 极窄屏（小屏手机）再压一档 */
        @media (max-width: 360px) {
            .hero-title { font-size: 1.1rem; }
            .back-btn   { top: 46px; font-size: 0.78rem; padding: 6px 10px; }
            .download-btn { font-size: 1.05rem; }
        }

        /* 横屏手机（矮屏）：整体压缩高度方向 */
        @media (max-height: 480px) {
            .hero { height: 48%; }
            .entries { height: 52%; padding: 12px 20px; }
            .hero-title { top: 12px; left: 16px; font-size: 1.2rem; }
            .back-btn { top: 12px; padding: 6px 12px; font-size: 0.82rem; }
            .download-btn { font-size: 1.15rem; padding: 14px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 上层：占 60% 高度，播放 SVG 动画 -->
        <div class="hero">
            <div class="hero-title">长理羽协 · 报名协会运营</div>
            <div class="back-btn" onclick="window.location.href='../index.html'">返回首页 &rarr;</div>
            <!-- 报名页背景图：优先 webp，回退 jpg（均已压缩，体积远小于原 PNG） -->
            <picture>
                <source srcset="RBAG.webp" type="image/webp">
                <img src="RBAG.jpg" alt="报名页背景">
            </picture>
        </div>

        <!-- 下层：下载报名表 -->
        <div class="entries">
            <a class="download-btn" href="../干事报名表.docx" download>
                <span class="download-icon">&#128229;</span>
                <span>下载报名表</span>
            </a>
        </div>
    </div>
</body>
</html>

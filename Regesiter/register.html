<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报名协会运营 · 长理羽协</title>
    <style>
        /* 引入本地字体 */
        @font-face {
            font-family: "MyFont";
            src: url("../zh-cn.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;               /* 禁止页面滚动 */
            font-family: "MyFont", "Microsoft YaHei", Arial, sans-serif;
        }

        /* ================= 关键帧动画 ================= */

        /* 上层 SVG 区域淡入 */
        @keyframes heroFade {
            from { opacity: 0; transform: scale(1.04) translateZ(0); }
            to   { opacity: 1; transform: scale(1)    translateZ(0); }
        }

        /* 下层整体从下方滑入 */
        @keyframes slideUp {
            from { transform: translateY(60px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* 入口卡片错落出现 */
        @keyframes cardIn {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* 页面容器 */
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ================= 上层：占 60% 高度，背景图 ================= */

        .hero {
            position: relative;
            height: 60%;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #287ee3;            /* 背景图未加载时的兜底背景色 */
            animation: heroFade 1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* 背景图：铺满整个上层区域 */
        .hero svg,
        .hero object,
        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;           /* 上层仅作展示 */
        }

        /* 顶层标题文字 */
        .hero-title {
            position: absolute;
            top: 24px;
            left: 32px;
            z-index: 2;
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-shadow: 0 3px 14px rgba(0, 0, 0, 0.55);
        }

        /* 返回按钮 */
        .back-btn {
            position: absolute;
            top: 24px;
            right: 32px;
            z-index: 3;
            padding: 10px 20px;
            font-size: 1rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            user-select: none;
            transition: background 0.25s ease, padding-right 0.25s ease;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.6);
            padding-right: 26px;
        }

        /* ================= 下层：占 40% 高度，下载报名表按钮 ================= */

        .entries {
            height: 40%;
            background: #287ee3;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            padding: 32px 40px;
            animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        /* 下载报名表按钮：直角风格 */
        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            min-width: 360px;
            padding: 24px 48px;
            font-size: 1.7rem;
            font-weight: bold;
            font-family: inherit;
            color: #287ee3;
            background: #ffffff;
            border: 2px solid #d0d7de;
            border-radius: 0;
            text-decoration: none;
            cursor: pointer;
            user-select: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
        }

        .download-btn:hover {
            transform: translateY(-6px);
            border-color: #4facfe;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .download-btn .download-icon {
            font-size: 1.8rem;
        }

        /* 小屏适配 */
        @media (max-width: 720px) {
            .hero-title { font-size: 1.5rem; }
            .entries { padding: 20px; }
            .download-btn { min-width: 0; width: 100%; font-size: 1.4rem; padding: 20px 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 上层：占 60% 高度，播放 SVG 动画 -->
        <div class="hero">
            <div class="hero-title">长理羽协 · 报名协会运营</div>
            <div class="back-btn" onclick="window.location.href='../index.html'">返回首页 &rarr;</div>
            <!-- 报名页背景图 -->
            <img src="RBAG.png" alt="报名页背景">
        </div>

        <!-- 下层：下载报名表 -->
        <div class="entries">
            <a class="download-btn" href="../干事报名表.docx" download>
                <span class="download-icon">&#128229;</span>
                <span>下载报名表</span>
            </a>
        </div>
    </div>
</body>
</html>

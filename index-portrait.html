<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#287ee3">
    <title>长沙理工大学学生羽毛球协会 · 报名运营</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        /* 引入本地字体（已子集化的精简版本） */
        @font-face {
            font-family: "MyFont";
            src: url("zh-cn.woff2") format("woff2"),
                 url("zh-cn-subset.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: "MyFont", "Microsoft YaHei", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ================= 动效设计令牌 ================= */
        :root {
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
            --stagger: 55ms;
        }

        /* ================= 关键帧动画 =================
           入场动画统一使用 backwards 填充，结束后回到基础样式，
           保证触屏的 :active 反馈不被动画终态覆盖。 */

        @keyframes heroReveal {
            from { clip-path: inset(100% 0 0 0); }
            to   { clip-path: inset(0 0 0 0); }
        }
        @keyframes heroSettle {
            from { opacity: 0.2; transform: scale(1.05); }
            to   { opacity: 1;   transform: scale(1); }
        }
        @keyframes panelReveal {
            from { clip-path: inset(0 0 100% 0); }
            to   { clip-path: inset(0 0 0 0); }
        }
        @keyframes tileIn {
            from { opacity: 0; transform: translateY(24px); clip-path: inset(100% 0 0 0); }
            to   { opacity: 1; transform: translateY(0);    clip-path: inset(0 0 0 0); }
        }
        @keyframes contentIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes rowIn {
            from { opacity: 0; transform: translateX(-12px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes charIn {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes emblemIn {
            from { opacity: 0; transform: scale(0.82); }
            to   { opacity: 1; transform: scale(1); }
        }
        @keyframes drawLine {
            from { stroke-dashoffset: 1; }
            to   { stroke-dashoffset: 0; }
        }
        @keyframes subtitleIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes flowDash {
            to { stroke-dashoffset: -360; }
        }
        @keyframes driftY {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50%      { transform: translateY(-8px) rotate(0.6deg) scale(1.035); }
        }
        @keyframes fieldDrift {
            from { transform: translate(-8px, 2px); }
            to   { transform: translate(8px, -4px); }
        }
        @keyframes auraBreathe {
            from { opacity: 0.62; transform: translate(-10px, 5px) scale(1); }
            to   { opacity: 1;    transform: translate(10px, -7px) scale(1.08); }
        }
        @keyframes beamTravel {
            to { stroke-dashoffset: 0; }
        }
        @keyframes dotPulse {
            from { opacity: 0.45; }
            to   { opacity: 1; }
        }
        @keyframes signupIn {
            from { opacity: 0; transform: translate(-50%, calc(-100% + 16px)) scale(0.92); }
            to   { opacity: 1; transform: translate(-50%, -100%) scale(1); }
        }

        /* ================= 页面容器 ================= */
        .container {
            position: relative;             /* 供报名按钮绝对定位参照 */
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ================= 上半：背景 SVG 动画区（约 50%） ================= */
        .hero {
            position: relative;
            height: 50%;
            overflow: hidden;
            background: #ffffff;
            animation: heroReveal 0.95s var(--ease-out) backwards;
        }
        .hero svg {
            display: block;
            width: 100%;
            height: 100%;
            animation: heroSettle 1.35s var(--ease-out) backwards;
        }

        /* 标题：逐字上浮 + 去模糊 */
        .banner-title .char {
            animation: charIn 0.7s var(--ease-out) backwards;
            animation-delay: calc(0.4s + var(--i, 0) * var(--stagger));
            will-change: transform, opacity, filter;
        }

        /* Logo：回弹式落定 */
        .emblem {
            transform-box: fill-box;
            transform-origin: center;
            animation: emblemIn 0.85s var(--ease-out) 0.15s backwards;
        }

        /* 下划线：按路径长度扫出 */
        .underline {
            stroke-dasharray: 1;
            stroke-dashoffset: 0;
            animation: drawLine 0.95s var(--ease-out) 1.05s backwards;
        }

        /* 英文副标题 */
        .banner-sub {
            animation: subtitleIn 0.8s var(--ease-out) 1.2s backwards;
        }

        /* 背景线条缓慢流动 */
        .flow-line {
            stroke-dasharray: 12 24;
            animation: flowDash var(--flow-dur, 10s) linear infinite;
        }
        .drift {
            transform-box: fill-box;
            transform-origin: center;
            animation: driftY 12s var(--ease-in-out) infinite;
        }

        /* 背景整体缓慢漂移 */
        .bg-field {
            transform-box: fill-box;
            transform-origin: center;
            animation: fieldDrift 26s var(--ease-in-out) infinite alternate;
            will-change: transform;
        }

        /* 光晕呼吸 */
        .aura {
            transform-box: fill-box;
            transform-origin: center;
            animation: auraBreathe 18s var(--ease-in-out) infinite alternate;
        }

        /* 流光束 */
        .beam {
            stroke-dasharray: 0.07 0.93;
            stroke-dashoffset: 1;
            opacity: 0.78;
            animation: beamTravel 7.5s linear infinite;
        }
        .beam:nth-child(2) { animation-duration: 10.5s; animation-delay: -3.5s; }
        .beam:nth-child(3) { animation-duration: 13s;   animation-delay: -7s; }

        /* 点阵呼吸 */
        .dot-field {
            animation: dotPulse 5.5s var(--ease-in-out) infinite alternate;
        }

        /* ================= 下半：按钮 + 信息区（约 50%） ================= */
        .panel {
            height: 50%;
            background: #287ee3;
            display: flex;
            flex-direction: column;
            padding: 12px 14px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            gap: 10px;
            animation: panelReveal 0.85s var(--ease-out) 0.1s backwards;
        }

        /* 三个按钮：竖排三行 */
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 0 0 auto;
        }

        .option-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
            background: #ffffff;
            color: #287ee3;
            border: 2px solid #d0d7de;
            border-radius: 0;
            font-size: 1.15rem;
            font-weight: bold;
            user-select: none;
            cursor: pointer;
            transition: background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease;
            animation: tileIn 0.65s var(--ease-out) backwards;
        }
        /* 视觉顺序与 DOM 一致：从上到下依次抽出 */
        .option-btn:nth-child(1) { animation-delay: 0.5s; }
        .option-btn:nth-child(2) { animation-delay: 0.6s; }
        .option-btn:nth-child(3) { animation-delay: 0.7s; }

        .option-btn.active {
            background: #e8f6ff;
            border-color: #4facfe;
            color: #0077c2;
        }

        /* 信息区：固定较小高度，显示当前按钮对应的说明文字 */
        .info-box {
            flex: 0 0 auto;                 /* 不再撑满剩余空间 */
            height: 132px;                  /* 固定较小高度 */
            max-height: 132px;
            background: #ffffff;
            border: 2px solid #d0d7de;
            border-radius: 0;
            overflow: hidden;
            position: relative;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .info-inner {
            width: 100%;
            color: #1f3a8a;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.7;
        }
        /* 信息切换进入时：内部行错落浮现（外层退场由 JS 控制） */
        .info-lines p,
        .info-dept span {
            animation: rowIn 0.5s var(--ease-out) backwards;
        }
        .info-lines p:nth-child(1),
        .info-dept span:nth-child(1) { animation-delay: 0.05s; }
        .info-lines p:nth-child(2),
        .info-dept span:nth-child(2) { animation-delay: 0.1s; }
        .info-dept span:nth-child(3) { animation-delay: 0.15s; }
        .info-dept span:nth-child(4) { animation-delay: 0.2s; }

        /* 信息区内的部门列表 */
        .info-dept {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-weight: bold;
            font-size: 1rem;
        }
        /* 信息区内的普通段落 */
        .info-lines { display: flex; flex-direction: column; gap: 6px; }
        .info-lines p { font-weight: bold; }
        /* 风采提示文字 */
        .info-slogan {
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 0.2em;
            color: #4f6bff;
            animation: contentIn 0.55s var(--ease-out) 0.05s backwards;
        }

        /* 桌面/大屏访问时，提示这是竖屏专用页（但仍可用） */
        @media (min-width: 821px) and (orientation: landscape) {
            .panel { padding: 16px; }
            .option-btn { height: 52px; font-size: 1.2rem; }
        }

        /* ================= 报名按钮（分隔线正中）与弹窗 ================= */

        /* 报名按钮：绝对定位于背景与下半区分隔线正中（50% 处），底边贴线并略上移 */
        .signup-btn {
            position: absolute;
            left: 50%;
            top: calc(50% - 12px);          /* 与 .hero 50% 分界对齐，再上移一点 */
            transform: translate(-50%, -100%);  /* 底边贴住分隔线 */
            z-index: 20;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 180px;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: inherit;
            color: #287ee3;
            background: #ffffff;
            border: 2px solid #287ee3;
            border-radius: 0;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            animation: signupIn 0.7s var(--ease-out) 1s backwards;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, color 0.25s ease;
        }

        .signup-btn:active {
            background: #287ee3;
            color: #ffffff;
        }

        /* 弹窗遮罩：可过渡的可见性 + 背景虚化 */
        .modal-mask {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 24, 48, 0.55);
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            transition:
                opacity 0.3s ease,
                visibility 0.3s,
                backdrop-filter 0.35s ease,
                -webkit-backdrop-filter 0.35s ease;
        }
        .modal-mask.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .modal {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 2px solid #287ee3;
            border-radius: 0;
            padding: 26px 22px 22px;
            text-align: center;
            opacity: 0;
            transform: translateY(22px) scale(0.96);
            transition:
                opacity 0.3s ease,
                transform 0.4s var(--ease-out);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        .modal-mask.open .modal {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #1f3a8a;
            margin-bottom: 14px;
            letter-spacing: 0.06em;
        }
        .modal-text {
            font-size: 1.05rem;
            color: #333;
            line-height: 1.75;
            margin-bottom: 20px;
        }
        .modal-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 22px;
            font-size: 1.15rem;
            font-weight: bold;
            font-family: inherit;
            color: #ffffff;
            background: #287ee3;
            border: 2px solid #287ee3;
            border-radius: 0;
            text-decoration: none;
            cursor: pointer;
        }
                .modal-close {
            margin-top: 14px;
            font-size: 0.92rem;
            color: #888;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            text-decoration: underline;
        }

        /* ---------- 报名说明（截止时间 + 提交邮箱） ---------- */
        .modal-notice {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-bottom: 16px;
            padding: 10px 12px;
            text-align: left;
            background: #f4f8ff;
            border-left: 4px solid #287ee3;
        }

        .modal-notice p {
            font-size: 0.92rem;
            color: #1f3a8a;
            line-height: 1.6;
        }

        .modal-notice p:first-child {
            font-weight: bold;
            letter-spacing: 0.08em;
        }

        /* 截止时间用红字突出（与新闻页红字提示同色） */
        .modal-notice p:nth-child(2) {
            font-weight: bold;
            color: #d21f1f;
        }

                .modal-notice p:nth-child(3) {
            font-weight: bold;
        }

        /* 邮箱单独占一行，放大突出便于复制 */
        .modal-notice .notice-mail {
            display: block;
            margin-top: 2px;
            padding: 5px 9px;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 0.02em;
            color: #287ee3;
            background: #ffffff;
            border: 1px solid rgba(40, 126, 227, 0.35);
            word-break: break-all;
            user-select: all;               /* 单击即可整段选中，方便复制 */
        }

        /* ================= 减少动态效果 ================= */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                transition-delay: 0ms !important;
            }
            .flow-line,
            .drift,
            .bg-field,
            .aura,
            .beam,
            .dot-field {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 上半：背景 SVG 动画 -->
        <div class="hero">
            <svg id="hero-svg" viewBox="0 0 1080 900" preserveAspectRatio="xMidYMid slice"
                 xmlns="http://www.w3.org/2000/svg" role="img"
                 aria-label="长沙理工大学学生羽毛球协会">
                <defs>
                    <linearGradient id="lineBlue" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0"   stop-color="#2f6bff"/>
                        <stop offset="0.5" stop-color="#5a6bff"/>
                        <stop offset="1"   stop-color="#8a5bff"/>
                    </linearGradient>
                    <linearGradient id="lineViolet" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0"   stop-color="#7a5bff"/>
                        <stop offset="1"   stop-color="#b15bff"/>
                    </linearGradient>
                    <linearGradient id="lineCyan" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0"   stop-color="#3fb8ff"/>
                        <stop offset="0.5" stop-color="#4f8bff"/>
                        <stop offset="1"   stop-color="#7a5bff"/>
                    </linearGradient>
                    <linearGradient id="lineFaint" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0"   stop-color="#4a5cff" stop-opacity="0.42"/>
                        <stop offset="1"   stop-color="#a07bff" stop-opacity="0.10"/>
                    </linearGradient>
                    <!-- 逐字独立 text 需要 userSpaceOnUse，避免每个字重复整条渐变 -->
                    <linearGradient id="titleGrad" gradientUnits="userSpaceOnUse"
                                    x1="348" y1="520" x2="732" y2="520">
                        <stop offset="0"   stop-color="#1f3a8a"/>
                        <stop offset="0.6" stop-color="#3a4fd0"/>
                        <stop offset="1"   stop-color="#7a4fe0"/>
                    </linearGradient>
                    <linearGradient id="accentGrad" gradientUnits="userSpaceOnUse"
                                    x1="316" y1="600" x2="764" y2="600">
                        <stop offset="0"   stop-color="#2f9bff"/>
                        <stop offset="0.5" stop-color="#4f6bff"/>
                        <stop offset="1"   stop-color="#a04fef"/>
                    </linearGradient>
                    <linearGradient id="underlineGrad" gradientUnits="userSpaceOnUse"
                                    x1="330" y1="630" x2="750" y2="630">
                        <stop offset="0"   stop-color="#2f9bff"/>
                        <stop offset="0.5" stop-color="#4f6bff"/>
                        <stop offset="1"   stop-color="#a04fef"/>
                    </linearGradient>

                    <!-- 背景呼吸光晕（极低透明度） -->
                    <radialGradient id="auraBlue" cx="50%" cy="50%" r="50%">
                        <stop offset="0"    stop-color="#4f8bff" stop-opacity="0.12"/>
                        <stop offset="0.55" stop-color="#5a6bff" stop-opacity="0.05"/>
                        <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
                    </radialGradient>
                    <radialGradient id="auraViolet" cx="50%" cy="50%" r="50%">
                        <stop offset="0"    stop-color="#8a5bff" stop-opacity="0.10"/>
                        <stop offset="0.55" stop-color="#a07bff" stop-opacity="0.04"/>
                        <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
                    </radialGradient>
                </defs>

                <!-- 背景：纯白 -->
                <rect x="0" y="0" width="1080" height="900" fill="#ffffff"/>

                <!-- ============ 背景动效层：整体缓慢漂移 ============ -->
                <g class="bg-field">

                    <!-- 呼吸光晕：缓慢放大、移动 -->
                    <g class="aura">
                        <ellipse cx="300" cy="180" rx="360" ry="260" fill="url(#auraBlue)"/>
                        <ellipse cx="850" cy="720" rx="380" ry="280" fill="url(#auraViolet)"/>
                    </g>

                <!-- ============ 纯线条背景装饰（蓝紫色系） ============ -->

                <!-- 贯穿的流动曲线群 -->
                <g fill="none" stroke="url(#lineFaint)" stroke-width="1.4">
                    <path class="flow-line"               d="M-60 120 C 220 90,  480 200, 760 170 S 1200 250, 1400 210"/>
                    <path class="flow-line" style="animation-duration:12s" d="M-60 200 C 240 170, 500 280, 780 250 S 1220 330, 1400 290"/>
                    <path class="flow-line" style="animation-duration:10s" d="M-60 280 C 260 250, 520 360, 800 330 S 1240 410, 1400 370"/>
                    <path class="flow-line" style="animation-duration:13s" d="M-60 360 C 280 330, 540 440, 820 410 S 1260 490, 1400 450"/>
                    <path class="flow-line" style="animation-duration:11s" d="M-60 700 C 260 660, 540 760, 820 720 S 1260 800, 1400 760"/>
                    <path class="flow-line" style="animation-duration:14s" d="M-60 780 C 280 740, 560 840, 840 800 S 1280 880, 1400 840"/>
                </g>

                <!-- 左上同心圆弧 -->
                <g fill="none" class="drift">
                    <circle cx="120" cy="80" r="80"  stroke="url(#lineBlue)"   stroke-width="2.2" stroke-opacity="0.5"/>
                    <circle cx="120" cy="80" r="120" stroke="url(#lineViolet)" stroke-width="1.8" stroke-opacity="0.36"/>
                    <circle cx="120" cy="80" r="165" stroke="url(#lineCyan)"   stroke-width="1.4" stroke-opacity="0.24"/>
                    <circle cx="120" cy="80" r="215" stroke="url(#lineBlue)"   stroke-width="1.1" stroke-opacity="0.15"/>
                </g>

                <!-- 右下同心弧 -->
                <g fill="none" class="drift" style="animation-delay:-4s">
                    <circle cx="1000" cy="850" r="140" stroke="url(#lineViolet)" stroke-width="2.2" stroke-opacity="0.42"/>
                    <circle cx="1000" cy="850" r="200" stroke="url(#lineBlue)"   stroke-width="1.6" stroke-opacity="0.26"/>
                    <circle cx="1000" cy="850" r="265" stroke="url(#lineCyan)"   stroke-width="1.2" stroke-opacity="0.16"/>
                </g>

                <!-- 右上同心弧 -->
                <g fill="none" class="drift" style="animation-delay:-2s">
                    <circle cx="1010" cy="60" r="90"  stroke="url(#lineCyan)"   stroke-width="1.8" stroke-opacity="0.34"/>
                    <circle cx="1010" cy="60" r="140" stroke="url(#lineViolet)" stroke-width="1.3" stroke-opacity="0.2"/>
                </g>

                <!-- 装饰点阵 -->
                <!-- 流光束：沿既有曲线掠过的短高光 -->
                <g class="beams" fill="none" stroke-linecap="round">
                    <path class="beam" pathLength="1" stroke="url(#lineBlue)" stroke-width="2.2"
                          d="M-60 280 C 260 250, 520 360, 800 330 S 1240 410, 1400 370"/>
                    <path class="beam" pathLength="1" stroke="url(#lineViolet)" stroke-width="1.9"
                          d="M-60 120 C 220 90, 480 200, 760 170 S 1200 250, 1400 210"/>
                    <path class="beam" pathLength="1" stroke="url(#lineCyan)" stroke-width="1.7"
                          d="M-60 780 C 280 740, 560 840, 840 800 S 1280 880, 1400 840"/>
                </g>

                <g class="dot-field" style="animation-delay:-2.4s"
                   fill="none" stroke="url(#lineViolet)" stroke-width="1.2" stroke-opacity="0.42">
                    <circle cx="860" cy="360" r="3"/>
                    <circle cx="920" cy="410" r="3"/>
                    <circle cx="980" cy="350" r="3"/>
                    <circle cx="900" cy="520" r="3"/>
                    <circle cx="960" cy="560" r="3"/>
                </g>

                </g><!-- /bg-field -->

                <!-- 协会 Logo（居中偏上） -->
                <g class="emblem">

                <!-- 标题（居中，两行）：逐字独立定位做错落入场 -->
                <g class="banner-title" font-family="MyFont, 'Microsoft YaHei', sans-serif" font-weight="bold" text-anchor="middle">
                    <text class="char" x="380" y="520" font-size="64" fill="url(#titleGrad)" style="--i:0">长</text>
                    <text class="char" x="444" y="520" font-size="64" fill="url(#titleGrad)" style="--i:1">沙</text>
                    <text class="char" x="508" y="520" font-size="64" fill="url(#titleGrad)" style="--i:2">理</text>
                    <text class="char" x="572" y="520" font-size="64" fill="url(#titleGrad)" style="--i:3">工</text>
                    <text class="char" x="636" y="520" font-size="64" fill="url(#titleGrad)" style="--i:4">大</text>
                    <text class="char" x="700" y="520" font-size="64" fill="url(#titleGrad)" style="--i:5">学</text>
                    <text class="char" x="348" y="600" font-size="64" fill="url(#accentGrad)" style="--i:6">学</text>
                    <text class="char" x="412" y="600" font-size="64" fill="url(#accentGrad)" style="--i:7">生</text>
                    <text class="char" x="476" y="600" font-size="64" fill="url(#accentGrad)" style="--i:8">羽</text>
                    <text class="char" x="540" y="600" font-size="64" fill="url(#accentGrad)" style="--i:9">毛</text>
                    <text class="char" x="604" y="600" font-size="64" fill="url(#accentGrad)" style="--i:10">球</text>
                    <text class="char" x="668" y="600" font-size="64" fill="url(#accentGrad)" style="--i:11">协</text>
                    <text class="char" x="732" y="600" font-size="64" fill="url(#accentGrad)" style="--i:12">会</text>
                    <path class="underline" d="M330 630 H750" pathLength="1"
                          stroke="url(#underlineGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
                </g>

                <!-- 英文副标题 -->
                <text class="banner-sub" x="540" y="680" text-anchor="middle" fill="#5a6bcc" font-size="20"
                      font-family="Arial, sans-serif" letter-spacing="3">
                    CSUST STUDENT BADMINTON ASSOCIATION
                </text>
            </svg>
        </div>

        <!-- 下半：三个按钮（竖排）+ 固定高度信息区 -->
        <div class="panel">
            <div class="btn-list">
                <div class="option-btn" data-role="register" role="button" tabindex="0"
                     onclick="onBtn('register', this)">协会动态</div>
                <div class="option-btn" data-role="style" role="button" tabindex="0"
                     onclick="onBtn('style', this)">协会风采</div>
                <div class="option-btn" data-role="intro" role="button" tabindex="0"
                     onclick="onBtn('intro', this)">协会介绍</div>
            </div>
            <div class="info-box">
                <div class="info-inner" id="info"></div>
            </div>
        </div>

                <!-- 报名按钮：位于背景与下半区分隔线正中；2026-11-26 00:00 后由脚本整块移除 -->
        <button class="signup-btn" id="signup-btn" type="button" onclick="openSignupModal()">干事报名</button>

        <!-- 报名弹窗 -->
        <div class="modal-mask" id="signup-modal" role="dialog" aria-modal="true"
             aria-labelledby="signup-title" onclick="if(event.target===this)closeSignupModal()">
            <div class="modal">
                <div class="modal-title" id="signup-title">干事报名</div>
                <div class="modal-text">下载报名表以向协会运营组织报名，我们期待你的到来！</div>

                <!-- 报名说明：数据收集截止时间与提交邮箱；过期后随按钮一并移除 -->
                <div class="modal-notice" id="signup-notice">
                    <p>报名说明</p>
                    <p>数据收集截止至 2026.11.26，0:00</p>
                    <p>请将报名表发送邮件至：</p>
                    <span class="notice-mail">csustnc@foxmail.com</span>
                </div>

                <a class="modal-download" href="报名数据收集表.xlsx" download>
                    <span>&#128229;</span>
                    <span>下载报名表</span>
                </a>
                <button class="modal-close" type="button" onclick="closeSignupModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        var btns = Array.prototype.slice.call(document.querySelectorAll('.option-btn'));
        var infoEl = document.getElementById('info');
        var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        function motionOff() {
            return reducedMotion.matches;
        }

        // 各按钮对应的信息区内容
        // 竖屏逻辑下：协会风采不使用图片，显示提示文字"我们的风采"
        var INFO = {
            register:
                '<div class="info-lines">' +
                    '<p>协会最新动态</p>' +
                    '<p>点击查看详讯</p>' +
                '</div>',
            style:
                '<div class="info-slogan">我们的风采</div>',
            intro:
                '<div class="info-dept">' +
                    '<span>裁判队</span>' +
                    '<span>协会办公室</span>' +
                    '<span>协会宣传组</span>' +
                    '<span>协会活动组</span>' +
                '</div>'
        };

        // 跳转目标
        var LINKS = {
            register: 'News/news.html',
            style:    'Senrio/highlights.html',
            intro:    'intro.html'
        };

        // 用 Web Animations API 控制信息区退场，可被下一次切换直接打断；
        // 入场与内部行错落由 CSS 自动播放。
        var INFORMATION_OUT_MS = 160;
        var switchToken = 0;

        function cancelAnimations(el) {
            if (el && typeof el.getAnimations === 'function') {
                el.getAnimations().forEach(function (anim) { anim.cancel(); });
            }
        }

        function showInfo(role) {
            var token = ++switchToken;
            var nextHTML = INFO[role] || '';
            var currentRole = infoEl.getAttribute('data-role') || '';
            var hasContent = infoEl.children.length > 0;

            if (hasContent && currentRole === role) {
                cancelAnimations(infoEl);
                return;
            }

            function mount() {
                if (token !== switchToken) return;
                // 退场动画停留在 fill:forwards，替换内容前必须撤销，
                // 否则信息区会一直保持 opacity:0。
                cancelAnimations(infoEl);
                infoEl.setAttribute('data-role', role || '');
                infoEl.innerHTML = nextHTML;
            }

            if (!hasContent || motionOff() || typeof infoEl.animate !== 'function') {
                cancelAnimations(infoEl);
                mount();
                return;
            }

            cancelAnimations(infoEl);
            var out = infoEl.animate(
                [
                    { opacity: 1, transform: 'translateY(0)' },
                    { opacity: 0, transform: 'translateY(-8px)' }
                ],
                {
                    duration: INFORMATION_OUT_MS,
                    easing: 'cubic-bezier(0.4, 0, 1, 1)',
                    fill: 'forwards'
                }
            );
            out.finished.then(mount, function () { /* 被新的切换取消 */ });
        }

        function setActive(role) {
            btns.forEach(function (b) {
                b.classList.toggle('active', b.getAttribute('data-role') === role);
            });
        }

        // 点击按钮：显示对应文字 + 跳转二级页面
        var jumping = false;
        function onBtn(role, el) {
            stopAuto();
            setActive(role);
            showInfo(role);
            if (jumping) return;
            jumping = true;
            // 略作停留，让用户看到信息区切换到对应文字
            setTimeout(function () {
                window.location.href = LINKS[role];
            }, 260);
        }

        // ---------- 自动轮播（无操作时） ----------
        var autoOrder = ['register', 'style', 'intro'];
        var autoStep = 0;
        var autoRunning = false;
        var HOLD_MS = 3000;      // 每项停留
        var GAP_MS = 700;        // 高亮熄灭的留白（缩短后节奏更连贯）
        var autoTimer = null;

        function stopAuto() {
            autoRunning = false;
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }
        }

        function runAutoStep() {
            if (!autoRunning) return;
            var role = autoOrder[autoStep];
            setActive(role);
            showInfo(role);

            autoTimer = setTimeout(function () {
                if (!autoRunning) return;
                setActive(null);

                autoTimer = setTimeout(function () {
                    if (!autoRunning) return;
                    autoStep = (autoStep + 1) % autoOrder.length;
                    runAutoStep();
                }, GAP_MS);
            }, HOLD_MS);
        }

        function startAuto(resetStep) {
            stopAuto();
            autoRunning = true;
            if (resetStep) autoStep = 0;
            runAutoStep();
        }

        function queueAutoStart(delay) {
            stopAuto();
            autoTimer = setTimeout(function () { startAuto(true); }, delay);
        }

        // 用户交互即暂停自动轮播
        btns.forEach(function (b) {
            b.addEventListener('touchstart', stopAuto, { passive: true });
            b.addEventListener('pointerdown', stopAuto, { passive: true });
            b.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    b.click();
                }
            });
        });

        // 页面不可见时停止计时，回来后从当前项继续
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                stopAuto();
            } else {
                startAuto(false);
            }
        });

        // 入场动画基本结束后再开始轮播，避免与标题/按钮抢戏；
        // 减少动态效果时只静态展示第一项，不做自动切换。
        if (motionOff()) {
            setActive('register');
            showInfo('register');
        } else {
            queueAutoStart(1800);
        }

        // ---------- 干事报名弹窗 ----------
        var modalEl = document.getElementById('signup-modal');
        var lastFocused = null;

        function openSignupModal() {
            if (!modalEl) return;
            stopAuto();
            lastFocused = document.activeElement;
            modalEl.classList.add('open');
            var download = modalEl.querySelector('.modal-download');
            if (download) {
                setTimeout(function () { download.focus(); }, 80);
            }
        }

        function closeSignupModal() {
            if (!modalEl || !modalEl.classList.contains('open')) return;
            modalEl.classList.remove('open');
            if (lastFocused && typeof lastFocused.focus === 'function') {
                lastFocused.focus();
            }
            if (!document.hidden) startAuto(false);
        }

                document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeSignupModal();
        });

                // ---------- 报名时限：2026-11-26 00:00 之后，报名按钮及其控件从主页移除 ----------
        // 说明：截止后不是“置灰不可点”，而是把报名按钮、报名说明、弹窗一并从 DOM 中删除，
        //       主页上不再出现任何与报名相关的控件。
        // 截止时间只在报名说明里以文字体现，主页不设单独的时限控件。
        (function signupDeadline() {
            var DEADLINE = new Date(2026, 10, 26, 0, 0, 0);   // 注意：月份从 0 开始，10 表示 11 月

            var signupBtn = document.getElementById('signup-btn');
            var noticeEl = document.getElementById('signup-notice');

            // 从主页彻底移除报名相关的全部控件
            function removeSignupUI() {
                if (deadlineTimer) clearTimeout(deadlineTimer);
                // 弹窗若正开着，先关掉；并避免关闭逻辑把焦点交还给已删除的按钮
                if (modalEl) {
                    modalEl.classList.remove('open');
                    lastFocused = null;
                }
                [signupBtn, noticeEl, modalEl].forEach(function (el) {
                    if (el && el.parentNode) el.parentNode.removeChild(el);
                });
            }

            var deadlineTimer = null;

            function scheduleRemoval() {
                var left = DEADLINE.getTime() - Date.now();
                if (left <= 0) {
                    removeSignupUI();
                    return;
                }
                // 到点那一刻再执行一次移除
                deadlineTimer = setTimeout(scheduleRemoval, Math.min(left, 2147483647));
            }

            scheduleRemoval();
        })();

        // ---------- 横屏（宽 > 高）时回到桌面版首页 ----------
        // 条件与 index.html 的竖屏跳转互斥，不会形成循环
        function backToLandscape() {
            var isLandscape = window.matchMedia('(orientation: landscape)').matches;
            if (isLandscape && window.innerWidth > window.innerHeight) {
                window.location.replace('index.html');
            }
        }
        window.addEventListener('orientationchange', function () {
            // 旋转后再判断，给浏览器更新尺寸留一点时间
            setTimeout(backToLandscape, 250);
        });
    </script>

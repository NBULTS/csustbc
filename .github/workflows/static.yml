# 部署静态站点到 GitHub Pages
name: Deploy static content to Pages

on:
  # 推送到默认分支时触发部署
  push:
    branches: ["main"]

  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署；生产部署不取消进行中的任务
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 部署前校验新闻数据文件，格式错误则中断部署（坏数据不上线）。
      # runner 自带 Node，无需额外安装依赖。
      - name: Validate news data
        run: node .github/scripts/validate-news.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # v3 内部依赖已停用的 upload-artifact@v3，会导致产物未上传
      # （deploy 报 "No artifacts named github-pages were found"），
      # 因此必须使用 v4 及以上版本。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # 只发布站点文件，排除仓库元数据与本地示例目录
          path: '.'
          exclude: |
            .git/**
            .github/**
            Regesiter(Not use just a example)/**
            **/*.bak

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


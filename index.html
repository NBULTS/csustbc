<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#287ee3">
    <title>长沙理工大学学生羽毛球协会 · 报名运营</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        /* 引入本地字体（已子集化的精简版本） */
        @font-face {
            font-family: "MyFont";
            src: url("zh-cn.woff2") format("woff2"),
                 url("zh-cn-subset.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;               /* 禁止页面滚动，避免出现滚动条 */
            font-family: "MyFont", "Microsoft YaHei", Arial, sans-serif;
        }

        /* ================= 关键帧动画 ================= */

        /* 上层图片：缓慢放大淡入（走 GPU 合成，避免卡顿） */
        @keyframes imageFadeIn {
            from { transform: scale(1.08) translateZ(0); opacity: 0; }
            to   { transform: scale(1)    translateZ(0); opacity: 1; }
        }

        /* 下层整体从下方滑入 */
        @keyframes slideUp {
            from { transform: translateY(60px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* 选项框错落出现：淡入 + 从右侧滑入 */
        @keyframes boxIn {
            from { transform: translateX(40px); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }

        /* 右侧内容淡入 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* 右侧内容切换时淡入上滑 */
        @keyframes fadeUp {
            from { transform: translateY(16px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* 右侧内容切换出去时淡出 */
        @keyframes fadeOut {
            from { transform: translateY(0);    opacity: 1; }
            to   { transform: translateY(-16px); opacity: 0; }
        }

        /* 页面容器：占满整个视口高度，使用动态视口单位适配移动端地址栏 */
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* 上层：占 60% 高度，仅作为裁剪容器，承载动画 SVG 背景 */
        .top-layer {
            height: 60%;
            overflow: hidden;               /* 裁剪内层放大溢出的部分 */
            background: #ffffff;            /* 背景底色：纯白 */
        }

        /* 上层内层：承载 SVG 背景并做动画，避免整层重采样 */
        .top-image {
            width: 100%;
            height: 100%;
            transform-origin: center center;
            backface-visibility: hidden;    /* 强制 GPU 合成 */
            will-change: transform, opacity;
            animation: imageFadeIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .top-image svg { display: block; width: 100%; height: 100%; }

        /* 下层：占 40% 高度，横向排列 */
        .bottom-layer {
            height: 40%;
            background: #287ee3;            /* 空白区域填充色 */
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between; /* 组件贴左，选项框贴右 */
            padding: 20px;
            gap: 20px;
            animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
        }

        /* 选项框区域：占 70% 宽度，整体靠右 */
        .options-area {
            width: 70%;
            height: 100%;
            display: flex;
            flex-direction: row-reverse;   /* 从右到左排列 */
            align-items: center;
            justify-content: flex-start;   /* reverse 下 flex-start 即靠右 */
            gap: 20px;
        }

        /* 三个选项框（直角）：高度与预览组件一致 */
        .option-box {
            flex: 1;
            height: 100%;
            background: #ffffff;
            border: 2px solid #d0d7de;
            border-radius: 0;               /* 直角框 */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 1.6rem;              /* 字号调大 */
            color: #333;
            user-select: none;
            /* 错落出现动画，延迟由 JS 设置 */
            animation: boxIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .option-box:hover {
            border-color: #4facfe;
            box-shadow: 0 6px 18px rgba(79, 172, 254, 0.3);
        }

        .option-box.selected {
            border-color: #4facfe;
            background: #e8f6ff;
            color: #0077c2;
            font-weight: bold;
        }

        /* ---------- 右侧预览组件：占 25% 宽度 ---------- */
        .preview {
            width: 25%;
            height: 100%;
            border: 2px solid #287ee3;      /* 未选中时与下方背景同色 */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.3rem;              /* 字号调大 */
            background: #287ee3;            /* 与下方背景色同色 */
            transition: background 0.3s ease, border-color 0.3s ease;
            overflow: hidden;
            position: relative;
            animation: fadeIn 0.9s ease 0.4s both;
        }

        /* 预览内容容器：切换时重播动画 */
        .preview-inner {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            text-align: center;
        }

        .preview-inner.animate-in {
            animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* 切换出去时的淡出动画 */
        .preview-inner.animate-out {
            animation: fadeOut 0.35s cubic-bezier(0.55, 0, 1, 0.45) both;
        }

        /* 部门名称列表（协会介绍） */
        .dept-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* 协会风采：四张小图网格 */
        .intro-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            width: 100%;
            height: 100%;
        }

        .intro-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 协会会员注册：介绍性文字 */
        .register-intro {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .register-intro p {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.6;
        }

        /* ================= 背景 SVG 内的动效 ================= */

        /* 标题文字逐字浮现 */
        .banner-title text {
            opacity: 0;
            animation: charIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes charIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 副标题下划线扫出 */
        .underline {
            stroke-dasharray: 480;
            stroke-dashoffset: 480;
            animation: drawLine 1.2s ease 1.2s forwards;
        }
        @keyframes drawLine { to { stroke-dashoffset: 0; } }

        /* 协会 Logo：与标题同期淡入，之后静止（不再浮动） */
        .emblem {
            opacity: 0;
            animation: emblemIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
        }
        @keyframes emblemIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* 背景线条：缓慢流动的虚线（纯装饰，蓝紫线条） */
        .flow-line {
            stroke-dasharray: 14 26;
            animation: flowDash 9s linear infinite;
        }
        @keyframes flowDash {
            to { stroke-dashoffset: -400; }
        }

        /* 线条缓慢上下漂浮 */
        .drift {
            animation: driftY 12s ease-in-out infinite;
        }
        @keyframes driftY {
            0%,100% { transform: translateY(0); }
            50%     { transform: translateY(-10px); }
        }

        /* ================================================================
           移动端适配（手机 / 竖屏 / 触屏）
           ================================================================ */

        /* 全局：禁止长按选中等干扰，提升触屏体验 */
        body { -webkit-tap-highlight-color: transparent; }

        /* 触屏设备：不显示悬停阴影（无 hover 语义） */
        @media (hover: none) {
            .option-box:hover { border-color: #d0d7de; box-shadow: none; }
        }

        /* 平板 / 窄桌面：下层改为纵向堆叠，选项框换行 */
        @media (max-width: 820px) {
            html, body { overflow: hidden; }

            .container { height: 100vh; height: 100dvh; }

            /* 上层背景区略收，给下层腾空间 */
            .top-layer { height: 46%; }

            .bottom-layer {
                height: 54%;
                flex-direction: column;
                align-items: stretch;
                justify-content: flex-start;
                padding: 10px;
                gap: 10px;
                padding-bottom: calc(10px + env(safe-area-inset-bottom));
            }

            /* 预览组件移到上方，横向铺满 */
            .preview {
                order: -1;             /* 预览排到选项框之上 */
                width: 100%;
                height: 40%;
                font-size: 1.05rem;
            }

            /* 选项区：三列等宽，占满整行 */
            .options-area {
                width: 100%;
                height: 60%;
                flex-direction: row-reverse;   /* 保持与桌面一致的视觉顺序 */
                gap: 10px;
            }

            .option-box {
                font-size: 1.05rem;
                height: 100%;
                padding: 6px;
                line-height: 1.3;
            }

            .dept-list { font-size: 1rem; gap: 6px; }
            .register-intro p { font-size: 1rem; }
            .intro-grid { gap: 4px; }
        }

        /* 手机竖屏细调 */
        @media (max-width: 480px) {
            .top-layer { height: 42%; }

            .bottom-layer { height: 58%; padding: 8px; gap: 8px; }

            .preview { height: 42%; font-size: 0.95rem; }

            .options-area { height: 58%; gap: 8px; }

            .option-box { font-size: 0.95rem; }

            .dept-list { font-size: 0.92rem; }
            .register-intro p { font-size: 0.92rem; }
        }

        /* 极矮屏（横屏手机）：整体压缩，避免溢出 */
        @media (max-height: 480px) {
            .top-layer { height: 40%; }
            .bottom-layer { height: 60%; padding: 6px 10px; gap: 8px; }
            .option-box { font-size: 0.9rem; }
            .preview { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 上层区域：轻量动画 SVG 背景（仅蓝紫线条 + Logo + 标题） -->
        <div class="top-layer">
            <div class="top-image">

                <!-- 长沙理工大学学生羽毛球协会主题横幅：仅由蓝紫色渐变线条构成 -->
                <svg id="hero-svg" viewBox="0 0 1440 486" preserveAspectRatio="xMidYMid slice"
                     xmlns="http://www.w3.org/2000/svg" role="img"
                     aria-label="长沙理工大学学生羽毛球协会">
                    <defs>
                        <!-- 线条渐变（蓝 → 蓝紫 → 紫），白底上取较深色调保证可见 -->
                        <linearGradient id="lineBlue" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0"   stop-color="#2f6bff"/>
                            <stop offset="0.5" stop-color="#5a6bff"/>
                            <stop offset="1"   stop-color="#8a5bff"/>
                        </linearGradient>
                        <linearGradient id="lineViolet" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0"   stop-color="#7a5bff"/>
                            <stop offset="1"   stop-color="#b15bff"/>
                        </linearGradient>
                        <linearGradient id="lineCyan" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0"   stop-color="#3fb8ff"/>
                            <stop offset="0.5" stop-color="#4f8bff"/>
                            <stop offset="1"   stop-color="#7a5bff"/>
                        </linearGradient>
                        <linearGradient id="lineFaint" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0"   stop-color="#4a5cff" stop-opacity="0.45"/>
                            <stop offset="1"   stop-color="#a07bff" stop-opacity="0.08"/>
                        </linearGradient>

                        <!-- 标题渐变（蓝紫，非纯色） -->
                        <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0"   stop-color="#1f3a8a"/>
                            <stop offset="0.6" stop-color="#3a4fd0"/>
                            <stop offset="1"   stop-color="#7a4fe0"/>
                        </linearGradient>
                        <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0"   stop-color="#2f9bff"/>
                            <stop offset="0.5" stop-color="#4f6bff"/>
                            <stop offset="1"   stop-color="#a04fef"/>
                        </linearGradient>
                    </defs>

                    <!-- 背景：纯白 -->
                    <rect x="0" y="0" width="1440" height="486" fill="#ffffff"/>

                    <!-- ============ 纯线条背景装饰（蓝紫色系，白底） ============ -->

                    <!-- 贯穿全宽的流动曲线群（自上而下多层，蓝紫渐隐） -->
                    <g fill="none" stroke="url(#lineFaint)" stroke-width="1.4">
                        <path class="flow-line"               d="M-60 40  C 220 0,   460 120, 720 80  S 1180 160, 1520 120"/>
                        <path class="flow-line" style="animation-duration:12s" d="M-60 95  C 240 55,  480 175, 740 135 S 1200 215, 1520 175"/>
                        <path class="flow-line" style="animation-duration:10s" d="M-60 150 C 260 110, 500 230, 760 190 S 1220 270, 1520 230"/>
                        <path class="flow-line" style="animation-duration:13s" d="M-60 205 C 280 165, 520 285, 780 245 S 1240 325, 1520 285"/>
                        <path class="flow-line" style="animation-duration:11s" d="M-60 260 C 300 220, 540 340, 800 300 S 1260 380, 1520 340"/>
                        <path class="flow-line" style="animation-duration:14s" d="M-60 315 C 320 275, 560 395, 820 355 S 1280 435, 1520 395"/>
                    </g>

                    <!-- 左上同心圆弧（蓝紫渐变描边，多层） -->
                    <g fill="none" class="drift">
                        <circle cx="130" cy="40" r="90"  stroke="url(#lineBlue)"   stroke-width="2.2" stroke-opacity="0.55"/>
                        <circle cx="130" cy="40" r="130" stroke="url(#lineViolet)" stroke-width="1.8" stroke-opacity="0.40"/>
                        <circle cx="130" cy="40" r="175" stroke="url(#lineCyan)"   stroke-width="1.4" stroke-opacity="0.28"/>
                        <circle cx="130" cy="40" r="225" stroke="url(#lineBlue)"   stroke-width="1.1" stroke-opacity="0.18"/>
                        <circle cx="130" cy="40" r="280" stroke="url(#lineViolet)" stroke-width="0.9" stroke-opacity="0.12"/>
                    </g>

                    <!-- 右上同心弧 -->
                    <g fill="none" class="drift" style="animation-delay:-5s">
                        <circle cx="1420" cy="30" r="80"  stroke="url(#lineViolet)" stroke-width="2"   stroke-opacity="0.45"/>
                        <circle cx="1420" cy="30" r="125" stroke="url(#lineCyan)"   stroke-width="1.5" stroke-opacity="0.30"/>
                        <circle cx="1420" cy="30" r="175" stroke="url(#lineBlue)"   stroke-width="1.1" stroke-opacity="0.18"/>
                    </g>

                    <!-- 右下同心弧 -->
                    <g fill="none" class="drift" style="animation-delay:-4s">
                        <circle cx="1380" cy="470" r="150" stroke="url(#lineViolet)" stroke-width="2.2" stroke-opacity="0.48"/>
                        <circle cx="1380" cy="470" r="210" stroke="url(#lineBlue)"   stroke-width="1.6" stroke-opacity="0.30"/>
                        <circle cx="1380" cy="470" r="275" stroke="url(#lineCyan)"   stroke-width="1.2" stroke-opacity="0.18"/>
                        <circle cx="1380" cy="470" r="345" stroke="url(#lineViolet)" stroke-width="0.9" stroke-opacity="0.10"/>
                    </g>

                    <!-- 左下同心弧 -->
                    <g fill="none" class="drift" style="animation-delay:-2s">
                        <circle cx="60" cy="480" r="130" stroke="url(#lineCyan)"   stroke-width="1.8" stroke-opacity="0.38"/>
                        <circle cx="60" cy="480" r="185" stroke="url(#lineBlue)"   stroke-width="1.3" stroke-opacity="0.22"/>
                        <circle cx="60" cy="480" r="245" stroke="url(#lineViolet)" stroke-width="1"   stroke-opacity="0.14"/>
                    </g>

                    <!-- 底部流动波线（多条叠层） -->
                    <g fill="none">
                        <path class="flow-line" style="animation-duration:14s" stroke="url(#lineBlue)" stroke-width="1.8" stroke-opacity="0.55"
                              d="M-50 400 C 240 360, 420 450, 700 410 S 1180 340, 1500 400"/>
                        <path class="flow-line" style="animation-duration:11s" stroke="url(#lineViolet)" stroke-width="1.6" stroke-opacity="0.45"
                              d="M-50 435 C 300 400, 520 480, 820 440 S 1240 380, 1500 435"/>
                        <path class="flow-line" style="animation-duration:16s" stroke="url(#lineCyan)" stroke-width="1.3" stroke-opacity="0.35"
                              d="M-50 470 C 280 440, 500 510, 800 475 S 1220 420, 1500 470"/>
                        <path class="flow-line" style="animation-duration:13s" stroke="url(#lineBlue)" stroke-width="1.1" stroke-opacity="0.25"
                              d="M-50 500 C 260 475, 480 530, 780 500 S 1200 460, 1500 500"/>
                    </g>

                    <!-- 顶部流动波线 -->
                    <g fill="none">
                        <path class="flow-line" style="animation-duration:15s" stroke="url(#lineViolet)" stroke-width="1.4" stroke-opacity="0.35"
                              d="M-50 45 C 300 75, 560 -10, 860 25 S 1280 90, 1500 45"/>
                        <path class="flow-line" style="animation-duration:12s" stroke="url(#lineCyan)" stroke-width="1.1" stroke-opacity="0.25"
                              d="M-50 15 C 320 40, 580 -30, 880 5 S 1300 55, 1500 15"/>
                    </g>

                    <!-- 装饰点阵（蓝紫小圆，非纯色描边，分散多处） -->
                    <g fill="none" stroke="url(#lineViolet)" stroke-width="1.2" stroke-opacity="0.45">
                        <circle cx="980" cy="90"  r="3"/>
                        <circle cx="1040" cy="140" r="3"/>
                        <circle cx="1100" cy="80"  r="3"/>
                        <circle cx="1160" cy="130" r="3"/>
                        <circle cx="1220" cy="70"  r="3"/>
                        <circle cx="1280" cy="120" r="3"/>
                        <circle cx="1340" cy="80"  r="3"/>
                    </g>
                    <g fill="none" stroke="url(#lineBlue)" stroke-width="1.2" stroke-opacity="0.4">
                        <circle cx="360" cy="430" r="3"/>
                        <circle cx="420" cy="450" r="3"/>
                        <circle cx="480" cy="425" r="3"/>
                        <circle cx="540" cy="455" r="3"/>
                    </g>

                    <!-- 协会 Logo（与标题同期淡入，之后静止） -->
                    <g class="emblem">
                        <image href="logo-emblem.webp" xlink:href="logo-emblem.png"
                               x="140" y="140" width="150" height="150"
                               preserveAspectRatio="xMidYMid meet"/>
                    </g>

                    <!-- 标题文字：长沙理工大学学生羽毛球协会（蓝紫渐变，非纯色） -->
                    <g class="banner-title" font-family="MyFont, 'Microsoft YaHei', sans-serif" font-weight="bold">
                        <text x="330" y="228" font-size="52" fill="url(#titleGrad)">
                            <tspan style="animation-delay:0.25s">长</tspan>
                            <tspan style="animation-delay:0.33s">沙</tspan>
                            <tspan style="animation-delay:0.41s">理</tspan>
                            <tspan style="animation-delay:0.49s">工</tspan>
                            <tspan style="animation-delay:0.57s">大</tspan>
                            <tspan style="animation-delay:0.65s">学</tspan>
                        </text>
                        <text x="330" y="292" font-size="52" fill="url(#accentGrad)">
                            <tspan style="animation-delay:0.73s">学</tspan>
                            <tspan style="animation-delay:0.81s">生</tspan>
                            <tspan style="animation-delay:0.89s">羽</tspan>
                            <tspan style="animation-delay:0.97s">毛</tspan>
                            <tspan style="animation-delay:1.05s">球</tspan>
                            <tspan style="animation-delay:1.13s">协</tspan>
                            <tspan style="animation-delay:1.21s">会</tspan>
                        </text>
                        <line class="underline" x1="330" y1="316" x2="810" y2="316"
                              stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round"/>
                    </g>

                    <!-- 英文副标题 -->
                    <text x="332" y="352" fill="#5a6bcc" font-size="18"
                          font-family="Arial, sans-serif" letter-spacing="3">
                        CSUST STUDENT BADMINTON ASSOCIATION
                    </text>
                </svg>

            </div>
        </div>

        <!-- 下层区域 -->
        <div class="bottom-layer">
            <!-- 选项框区域：占 70% 宽度，从右到左排列 -->
            <div class="options-area">


                <!-- 报名协会运营：点击跳转报名二级页面 -->
                <div class="option-box" data-role="register" onclick="goToRegister(this)">报名协会运营</div>

                <!-- 协会风采：点击跳转二级页面（长理理工杯） -->
                <div class="option-box" data-role="style" onclick="goToStyle(this)">协会风采</div>

                <!-- 协会介绍：点击跳转二级页面 -->
                <div class="option-box" data-role="intro" onclick="goToIntro(this)">协会介绍</div>
            </div>

            <!-- 右侧预览组件 -->
            <div class="preview" id="preview"></div>
        </div>
    </div>

    <script>
        var boxes = document.querySelectorAll('.option-box');
        var previewEl = document.getElementById('preview');
        var BG_COLOR = '#287ee3';           // 与下方区域背景同色

        // 协会风采使用的四张缩略图
        var introImages = [
            'Intro/thumbs/01.jpg',
            'Intro/thumbs/02.jpg',
            'Intro/thumbs/03.jpg',
            'Intro/thumbs/IMG_20260602_183137.jpg'
        ];

        // 给选项框设置错落的出现延迟
        boxes.forEach(function (box, i) {
            box.style.animationDelay = (0.3 + i * 0.12) + 's';
        });

        // 重播预览内容的入场动画
        function replayAnimation(el) {
            el.classList.remove('animate-in');
            void el.offsetWidth;   // 强制重排，使动画可重播
            el.classList.add('animate-in');
        }

        // 构建"协会介绍"内容 HTML：从上到下四个部门名称
        function buildIntroHTML() {
            return '<div class="preview-inner">' +
                       '<div class="dept-list">' +
                           '<span>裁判队</span>' +
                           '<span>协会办公室</span>' +
                           '<span>协会宣传组</span>' +
                           '<span>协会活动组</span>' +
                       '</div>' +
                   '</div>';
        }

        // 构建"协会风采"内容 HTML：四张缩略图一起展示
        function buildStyleHTML() {
            var html = '<div class="preview-inner"><div class="intro-grid">';
            introImages.forEach(function (src) {
                html += '<img src="' + src + '" alt="">';
            });
            html += '</div></div>';
            return html;
        }

        // 构建"报名协会运营"内容 HTML：介绍性文字
        function buildRegisterHTML() {
            return '<div class="preview-inner">' +
                       '<div class="register-intro">' +
                           '<p>报名加入协会运营</p>' +
                           '<p>请下载并填写报名表</p>' +
                       '</div>' +
                   '</div>';
        }

        // 根据组件 role 构建对应内容 HTML；无内容返回空字符串
        function buildPreviewHTML(box) {
            if (!box) return '';
            var role = box.getAttribute('data-role');
            if (role === 'intro')    return buildIntroHTML();
            if (role === 'style')    return buildStyleHTML();
            if (role === 'register') return buildRegisterHTML();
            return '';
        }

        // 带淡出 / 淡入的预览切换
        var OUT_MS = 350;   // 与 .animate-out 动画时长保持一致
        var switchToken = 0;   // 防止快速切换时回调错乱

        function switchPreview(box) {
            var token = ++switchToken;
            var current = previewEl.querySelector('.preview-inner');
            var nextHTML = buildPreviewHTML(box);

            // 先淡出当前内容，再替换为新内容并淡入
            if (current) {
                current.classList.remove('animate-in');
                current.classList.add('animate-out');
                setTimeout(function () {
                    if (token !== switchToken) return;   // 已有更新的切换，忽略本次
                    previewEl.innerHTML = nextHTML;
                    var next = previewEl.querySelector('.preview-inner');
                    if (next) replayAnimation(next);
                }, OUT_MS);
            } else {
                previewEl.innerHTML = nextHTML;
                var next = previewEl.querySelector('.preview-inner');
                if (next) replayAnimation(next);
            }
        }

        // 重置右侧组件为"未选中"状态（带淡出）
        function resetPreview() {
            var current = previewEl.querySelector('.preview-inner');
            var token = ++switchToken;
            if (current) {
                current.classList.remove('animate-in');
                current.classList.add('animate-out');
                setTimeout(function () {
                    if (token !== switchToken) return;
                    previewEl.innerHTML = '';
                }, OUT_MS);
            } else {
                previewEl.innerHTML = '';
            }
        }

        // ---------- 选中逻辑 ----------
        function setSelected(box) {
            boxes.forEach(function (b) { b.classList.remove('selected'); });
            if (box) box.classList.add('selected');
        }

        function selectBox(el) {
            setSelected(el);
            switchPreview(el);
        }

        // 跳转到"协会介绍"二级页面
        function goToIntro(el) {
            setSelected(el);
            window.location.href = 'intro.html';
        }

        // 跳转到"协会风采"二级页面（长理理工杯）
        function goToStyle(el) {
            setSelected(el);
            window.location.href = 'Senrio/highlights.html';
        }

        // 跳转到"报名协会运营"二级页面
        function goToRegister(el) {
            setSelected(el);
            window.location.href = 'Regesiter/register.html';
        }

        // ---------- 鼠标悬停交互 ----------
        boxes.forEach(function (box) {
            box.addEventListener('mouseenter', function () {
                setSelected(box);
                switchPreview(box);
            });
            box.addEventListener('mouseleave', function () {
                if (!autoRunning) {
                    setSelected(null);
                    resetPreview();
                }
            });
        });

        // ---------- 自动滚动机制 ----------
        // DOM 为 row-reverse，boxes 顺序：[协会会员注册, 协会风采, 协会介绍]
        // 视觉从左到右依次为 index 2, 1, 0
        var autoOrder = [2, 1, 0];
        var autoStep = 0;
        var autoRunning = true;
        var HOLD_MS = 3000;      // 每个组件选中停留 3 秒
        var GAP_MS = 2000;       // 中间不选中 2 秒
        var autoTimeout = null;

        function autoLoop() {
            if (!autoRunning) return;
            // 1) 选中并停留 3 秒
            var box = boxes[autoOrder[autoStep]];
            setSelected(box);
            switchPreview(box);

            autoTimeout = setTimeout(function () {
                if (!autoRunning) return;
                // 2) 全部取消选中 2 秒
                setSelected(null);
                resetPreview();

                autoTimeout = setTimeout(function () {
                    if (!autoRunning) return;
                    autoStep = (autoStep + 1) % autoOrder.length;
                    autoLoop();
                }, GAP_MS);
            }, HOLD_MS);
        }

        // 鼠标进入选项框区域时暂停自动滚动，离开后恢复
        document.querySelector('.options-area').addEventListener('mouseenter', function () {
            autoRunning = false;
            if (autoTimeout) clearTimeout(autoTimeout);
        });
        document.querySelector('.options-area').addEventListener('mouseleave', function () {
            autoRunning = true;
            setSelected(null);
            resetPreview();
            autoStep = 0;
            autoLoop();
        });

        // 启动自动滚动
        autoLoop();

        // ---------- 背景 SVG 自适应：竖屏/窄屏避免裁掉 Logo 与标题 ----------
        var heroSvg = document.getElementById('hero-svg');
        var heroBox = document.querySelector('.top-layer');

        function fitHeroSvg() {
            if (!heroSvg || !heroBox) return;
            var w = heroBox.clientWidth;
            var h = heroBox.clientHeight;
            // 内容宽高比约 1440:486 ≈ 2.96
            var boxRatio = w / h;
            if (boxRatio < 2.2) {
                // 竖屏 / 窄屏：完整显示整幅横幅（Logo + 标题都在可视区内）
                heroSvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            } else {
                // 宽屏：铺满容器，左右裁切装饰线条
                heroSvg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
            }
        }

        fitHeroSvg();
        window.addEventListener('resize', fitHeroSvg);
        window.addEventListener('orientationchange', fitHeroSvg);

        // ---------- 竖屏访问时，跳转到竖屏专用首页 ----------
        (function redirectPortrait() {
            var isPortrait = window.matchMedia('(orientation: portrait)').matches;
            var isNarrow = window.matchMedia('(max-width: 820px)').matches;
            if (isPortrait && isNarrow) {
                // 用 replace，避免返回时又跳回来形成死循环
                window.location.replace('index-portrait.html');
            }
        })();
    </script>
</body>
</html>

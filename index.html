<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#287ee3">
    <title>长沙理工大学学生羽毛球协会 · 报名运营</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        /* 引入本地字体（已子集化的精简版本） */
        @font-face {
            font-family: "MyFont";
            src: url("zh-cn.woff2") format("woff2"),
                 url("zh-cn-subset.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;               /* 禁止页面滚动，避免出现滚动条 */
            font-family: "MyFont", "Microsoft YaHei", Arial, sans-serif;
        }

        /* ================= 动效设计令牌 ================= */
        :root {
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
            --stagger: 55ms;
        }

        /* ================= 关键帧动画 =================
           所有入场动画均使用 backwards 填充：
           延迟期间保持起始态，播放结束后回到元素自身的基础样式，
           这样悬停 / 选中 / 位移等交互不会被动画终态锁死。 */

        /* 上层：从分隔线向上展开（裁切揭示） */
        @keyframes heroReveal {
            from { clip-path: inset(100% 0 0 0); }
            to   { clip-path: inset(0 0 0 0); }
        }

        /* SVG 内部缓慢落定：轻微放大 + 淡入 */
        @keyframes heroSettle {
            from { opacity: 0.2; transform: scale(1.06); }
            to   { opacity: 1;   transform: scale(1); }
        }

        /* 下层：从分隔线向下展开 */
        @keyframes panelReveal {
            from { clip-path: inset(0 0 100% 0); }
            to   { clip-path: inset(0 0 0 0); }
        }

        /* 选项框：向上抽出 */
        @keyframes tileIn {
            from { opacity: 0; transform: translateY(28px); clip-path: inset(100% 0 0 0); }
            to   { opacity: 1; transform: translateY(0);    clip-path: inset(0 0 0 0); }
        }

        /* 预览区：自右向左擦入 */
        @keyframes previewIn {
            from { opacity: 0; transform: translateX(30px); clip-path: inset(0 0 0 100%); }
            to   { opacity: 1; transform: translateX(0);    clip-path: inset(0 0 0 0); }
        }

        /* 预览内列表行：从左侧滑入 */
        @keyframes rowIn {
            from { opacity: 0; transform: translateX(-14px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* 预览内图片：缩放 + 向上揭示 */
        @keyframes imageIn {
            from { opacity: 0; transform: scale(1.14); clip-path: inset(100% 0 0 0); }
            to   { opacity: 1; transform: scale(1);    clip-path: inset(0 0 0 0); }
        }

        /* 报名按钮：从分隔线下方轻轻托起 */
        @keyframes signupIn {
            from { opacity: 0; transform: translate(-50%, calc(-100% + 18px)) scale(0.92); }
            to   { opacity: 1; transform: translate(-50%, -100%) scale(1); }
        }

        /* 标题单字：上浮 + 去模糊 */
        @keyframes charIn {
            from { opacity: 0; transform: translateY(22px); filter: blur(8px); }
            to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
        }

        /* Logo：回弹式落定 */
        @keyframes emblemIn {
            from { opacity: 0; transform: scale(0.8); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* 下划线：按路径长度扫出 */
        @keyframes drawLine {
            from { stroke-dashoffset: 1; }
            to   { stroke-dashoffset: 0; }
        }

        /* 英文副标题：淡入上浮 */
        @keyframes subtitleIn {
            from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
            to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
        }

        /* 背景虚线：缓慢流动 */
        @keyframes flowDash {
            to { stroke-dashoffset: -400; }
        }

        /* 装饰弧线：轻微漂浮 + 旋转 + 呼吸 */
        @keyframes driftY {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50%      { transform: translateY(-9px) rotate(0.6deg) scale(1.035); }
        }

        /* 背景整体缓慢漂移 */
        @keyframes fieldDrift {
            from { transform: translate(-10px, 2px); }
            to   { transform: translate(10px, -5px); }
        }

        /* 光晕呼吸 */
        @keyframes auraBreathe {
            from { opacity: 0.65; transform: translate(-14px, 6px) scale(1); }
            to   { opacity: 1;    transform: translate(14px, -8px) scale(1.08); }
        }

        /* 流光束沿路径推进 */
        @keyframes beamTravel {
            to { stroke-dashoffset: 0; }
        }

        /* 点阵明暗呼吸 */
        @keyframes dotPulse {
            from { opacity: 0.45; }
            to   { opacity: 1; }
        }

        /* 页面容器：占满整个视口高度，使用动态视口单位适配移动端地址栏 */
        .container {
            position: relative;             /* 供报名按钮绝对定位参照 */
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* 上层：占 60% 高度，仅作为裁剪容器，承载动画 SVG 背景 */
        .top-layer {
            height: 60%;
            overflow: hidden;               /* 裁剪内层放大溢出的部分 */
            background: #ffffff;            /* 背景底色：纯白 */
        }

        /* 上层内层：承载 SVG 背景并做动画，避免整层重采样 */
        .top-image {
            width: 100%;
            height: 100%;
            transform-origin: center center;
            backface-visibility: hidden;    /* 强制 GPU 合成 */
            animation: heroReveal 1.05s var(--ease-out) backwards;
        }

        .top-image svg {
            display: block;
            width: 100%;
            height: 100%;
            animation: heroSettle 1.5s var(--ease-out) backwards;
        }

        /* 下层：占 40% 高度，横向排列 */
        .bottom-layer {
            height: 40%;
            background: #287ee3;            /* 空白区域填充色 */
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between; /* 组件贴左，选项框贴右 */
            padding: 20px;
            gap: 20px;
            animation: panelReveal 0.85s var(--ease-out) 0.12s backwards;
        }

        /* 选项框区域：占 70% 宽度，整体靠右 */
        .options-area {
            width: 70%;
            height: 100%;
            display: flex;
            flex-direction: row-reverse;   /* 从右到左排列 */
            align-items: center;
            justify-content: flex-start;   /* reverse 下 flex-start 即靠右 */
            gap: 20px;
        }

        /* 三个选项框（直角）：高度与预览组件一致 */
        .option-box {
            flex: 1;
            height: 100%;
            background: #ffffff;
            border: 2px solid #d0d7de;
            border-radius: 0;               /* 直角框 */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.28s ease, background-color 0.28s ease,
                        color 0.28s ease, box-shadow 0.32s var(--ease-out);
            font-size: 1.6rem;              /* 字号调大 */
            color: #333;
            user-select: none;
            /* 错落出现：视觉上从右向左依次抽出 */
            animation: tileIn 0.7s var(--ease-out) backwards;
            animation-delay: calc(0.5s + var(--i, 0) * 0.09s);
        }
        .option-box:nth-child(1) { --i: 0; }
        .option-box:nth-child(2) { --i: 1; }
        .option-box:nth-child(3) { --i: 2; }

        .option-box:hover {
            border-color: #4facfe;
            box-shadow: 0 6px 18px rgba(79, 172, 254, 0.3);
        }

        .option-box.selected {
            border-color: #4facfe;
            background: #e8f6ff;
            color: #0077c2;
            font-weight: bold;
        }

        .option-box:focus-visible {
            outline: 3px solid rgba(40, 126, 227, 0.45);
            outline-offset: -6px;
        }

        /* ---------- 右侧预览组件：占 25% 宽度 ---------- */
        .preview {
            width: 25%;
            height: 100%;
            border: 2px solid #287ee3;      /* 未选中时与下方背景同色 */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.3rem;              /* 字号调大 */
            background: #287ee3;            /* 与下方背景色同色 */
            transition: background 0.3s ease, border-color 0.3s ease;
            overflow: hidden;
            position: relative;
            animation: previewIn 0.8s var(--ease-out) 0.55s backwards;
        }

        /* 预览内容容器：切换时重播动画 */
        .preview-inner {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            text-align: center;
        }

        /* 切换进入时：内容按层级依次浮现（外层切换由 JS 负责） */
        .dept-list > span,
        .register-intro > p {
            animation: rowIn 0.52s var(--ease-out) backwards;
        }
        .dept-list > span:nth-child(1),
        .register-intro > p:nth-child(1) { animation-delay: 0.06s; }
        .dept-list > span:nth-child(2),
        .register-intro > p:nth-child(2) { animation-delay: 0.12s; }
        .dept-list > span:nth-child(3) { animation-delay: 0.18s; }
        .dept-list > span:nth-child(4) { animation-delay: 0.24s; }

        .intro-grid img {
            animation: imageIn 0.6s var(--ease-out) backwards;
        }
        .intro-grid img:nth-child(1) { animation-delay: 0.05s; }
        .intro-grid img:nth-child(2) { animation-delay: 0.11s; }
        .intro-grid img:nth-child(3) { animation-delay: 0.17s; }
        .intro-grid img:nth-child(4) { animation-delay: 0.23s; }

        /* 部门名称列表（协会介绍） */
        .dept-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* 协会风采：四张小图网格 */
        .intro-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            width: 100%;
            height: 100%;
        }

        .intro-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 协会会员注册：介绍性文字 */
        .register-intro {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .register-intro p {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
            line-height: 1.6;
        }

        /* ================= 背景 SVG 内的动效 ================= */

        /* 标题：逐字上浮 + 去模糊，形成从左到右的阅读波 */
        .banner-title .char {
            animation: charIn 0.72s var(--ease-out) backwards;
            animation-delay: calc(0.45s + var(--i, 0) * var(--stagger));
        }

        /* 副标题下划线：按路径长度扫出 */
        .underline {
            stroke-dasharray: 1;
            stroke-dashoffset: 0;
            animation: drawLine 1s var(--ease-out) 1.18s backwards;
        }

        /* 协会 Logo：回弹式落定，之后静止 */
        .emblem {
            transform-box: fill-box;
            transform-origin: center;
            animation: emblemIn 0.9s var(--ease-out) 0.18s backwards;
        }

        /* 英文副标题 */
        .banner-sub {
            animation: subtitleIn 0.85s var(--ease-out) 1.32s backwards;
        }

        /* 背景线条：缓慢流动的虚线（纯装饰，蓝紫线条） */
        .flow-line {
            stroke-dasharray: 12 26;
            animation: flowDash var(--flow-dur, 10s) linear infinite;
        }

        /* 装饰弧线：轻微上下漂浮、旋转并呼吸缩放 */
        .drift {
            transform-box: fill-box;
            transform-origin: center;
            animation: driftY 12s var(--ease-in-out) infinite;
        }

        /* 背景整体：极缓慢的横向漂移，形成空气流动感 */
        .bg-field {
            transform-box: fill-box;
            transform-origin: center;
            animation: fieldDrift 26s var(--ease-in-out) infinite alternate;
            will-change: transform;
        }

        /* 光晕：缓慢呼吸与游移 */
        .aura {
            transform-box: fill-box;
            transform-origin: center;
            animation: auraBreathe 18s var(--ease-in-out) infinite alternate;
        }

        /* 流光束：沿曲线掠过的短高光 */
        .beam {
            stroke-dasharray: 0.07 0.93;
            stroke-dashoffset: 1;
            opacity: 0.78;
            animation: beamTravel 7.5s linear infinite;
        }
        .beam:nth-child(2) { animation-duration: 10.5s; animation-delay: -3.5s; }
        .beam:nth-child(3) { animation-duration: 13s;   animation-delay: -7s; }

        /* 点阵：明暗呼吸 */
        .dot-field {
            animation: dotPulse 5.5s var(--ease-in-out) infinite alternate;
        }

        /* ================================================================
           移动端适配（手机 / 竖屏 / 触屏）
           ================================================================ */

        /* 全局：禁止长按选中等干扰，提升触屏体验 */
        body { -webkit-tap-highlight-color: transparent; }

        /* 触屏设备：不显示悬停阴影（无 hover 语义） */
        @media (hover: none) {
            .option-box:hover { border-color: #d0d7de; box-shadow: none; }
        }

        /* 平板 / 窄桌面：下层改为纵向堆叠，选项框换行 */
        @media (max-width: 820px) {
            html, body { overflow: hidden; }

            .container { height: 100vh; height: 100dvh; }

            /* 上层背景区略收，给下层腾空间 */
            .top-layer { height: 46%; }

            .bottom-layer {
                height: 54%;
                flex-direction: column;
                align-items: stretch;
                justify-content: flex-start;
                padding: 10px;
                gap: 10px;
                padding-bottom: calc(10px + env(safe-area-inset-bottom));
            }

            /* 预览组件移到上方，横向铺满 */
            .preview {
                order: -1;             /* 预览排到选项框之上 */
                width: 100%;
                height: 40%;
                font-size: 1.05rem;
            }

            /* 选项区：三列等宽，占满整行 */
            .options-area {
                width: 100%;
                height: 60%;
                flex-direction: row-reverse;   /* 保持与桌面一致的视觉顺序 */
                gap: 10px;
            }

            .option-box {
                font-size: 1.05rem;
                height: 100%;
                padding: 6px;
                line-height: 1.3;
            }

            .dept-list { font-size: 1rem; gap: 6px; }
            .register-intro p { font-size: 1rem; }
            .intro-grid { gap: 4px; }
        }

        /* 手机竖屏细调 */
        @media (max-width: 480px) {
            .top-layer { height: 42%; }

            .bottom-layer { height: 58%; padding: 8px; gap: 8px; }

            .preview { height: 42%; font-size: 0.95rem; }

            .options-area { height: 58%; gap: 8px; }

            .option-box { font-size: 0.95rem; }

            .dept-list { font-size: 0.92rem; }
            .register-intro p { font-size: 0.92rem; }
        }

        /* 极矮屏（横屏手机）：整体压缩，避免溢出 */
        @media (max-height: 480px) {
            .top-layer { height: 40%; }
            .bottom-layer { height: 60%; padding: 6px 10px; gap: 8px; }
            .option-box { font-size: 0.9rem; }
            .preview { font-size: 0.9rem; }
        }

        /* ================= 报名按钮（分隔线正中）与弹窗 ================= */

        /* 报名按钮：绝对定位于背景与功能区分隔线正中，底边贴线并略上移 */
        .signup-btn {
            position: absolute;
            left: 50%;
            top: calc(60% - 14px);          /* 与 .top-layer 60% 分界对齐，再上移一点 */
            transform: translate(-50%, -100%);  /* 底边贴住分隔线 */
            z-index: 20;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 220px;
            padding: 14px 34px;
            font-size: 1.25rem;
            font-weight: bold;
            font-family: inherit;
            color: #287ee3;
            background: #ffffff;
            border: 2px solid #287ee3;
            border-radius: 0;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            animation: signupIn 0.75s var(--ease-out) 1.05s backwards;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, color 0.25s ease;
        }

        .signup-btn:hover {
            background: #287ee3;
            color: #ffffff;
            transform: translate(-50%, calc(-100% - 4px));  /* 底边贴线基础上再上浮 */
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        }

        /* 弹窗遮罩：可过渡的可见性 + 背景虚化 */
        .modal-mask {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 24, 48, 0.55);
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            transition:
                opacity 0.3s ease,
                visibility 0.3s,
                backdrop-filter 0.35s ease,
                -webkit-backdrop-filter 0.35s ease;
        }

        .modal-mask.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* 弹窗主体：直角风格，带轻微回弹 */
        .modal {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 2px solid #287ee3;
            border-radius: 0;
            padding: 30px 28px 26px;
            text-align: center;
            opacity: 0;
            transform: translateY(22px) scale(0.96);
            transition:
                opacity 0.3s ease,
                transform 0.42s var(--ease-out);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .modal-mask.open .modal {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #1f3a8a;
            margin-bottom: 16px;
            letter-spacing: 0.06em;
        }

        .modal-text {
            font-size: 1.1rem;
            color: #333;
            line-height: 1.75;
            margin-bottom: 24px;
        }

        /* 弹窗内下载按钮 */
        .modal-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: inherit;
            color: #ffffff;
            background: #287ee3;
            border: 2px solid #287ee3;
            border-radius: 0;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .modal-download:hover {
            background: #1f6bd0;
            transform: translateY(-3px);
        }

                /* 弹窗关闭按钮 */
        .modal-close {
            margin-top: 16px;
            font-size: 0.95rem;
            color: #888;
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            text-decoration: underline;
        }

        /* ---------- 报名说明（截止时间 + 提交邮箱） ---------- */
        .modal-notice {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 20px;
            padding: 12px 14px;
            text-align: left;
            background: #f4f8ff;
            border-left: 4px solid #287ee3;
        }

        .modal-notice p {
            font-size: 1rem;
            color: #1f3a8a;
            line-height: 1.7;
        }

        /* 第一行“报名说明”作为小标题 */
        .modal-notice p:first-child {
            font-weight: bold;
            letter-spacing: 0.08em;
            margin-bottom: 2px;
        }

                /* 截止时间用红字突出（与新闻页红字提示同色） */
        .modal-notice p:nth-child(2) {
            font-weight: bold;
            color: #d21f1f;
        }

        .modal-notice p:nth-child(3) {
            font-weight: bold;
        }

        /* 邮箱单独占一行，放大突出便于复制 */
        .modal-notice .notice-mail {
            display: block;
            margin-top: 2px;
            padding: 6px 10px;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            font-size: 1.05rem;
            font-weight: bold;
            letter-spacing: 0.02em;
            color: #287ee3;
            background: #ffffff;
            border: 1px solid rgba(40, 126, 227, 0.35);
            word-break: break-all;
            user-select: all;               /* 单击即可整段选中，方便复制 */
        }

        /* 触屏：不显示悬停阴影 */
        @media (hover: none) {
            .option-box:hover { border-color: #d0d7de; box-shadow: none; }
            .signup-btn:hover { transform: translate(-50%, -100%); }
            .modal-download:hover { transform: none; }
        }

                /* 窄屏：报名按钮略缩，位置随布局微调（底边始终贴分隔线） */
        @media (max-width: 820px) {
            .signup-btn {
                top: calc(46% - 12px);  /* 与窄屏 .top-layer 46% 对齐 */
                padding: 12px 26px;
                font-size: 1.1rem;
                min-width: 180px;
            }
        }
        @media (max-width: 480px) {
            .signup-btn {
                top: calc(42% - 10px);  /* 与竖屏 .top-layer 42% 对齐 */
                padding: 11px 22px;
                font-size: 1rem;
                min-width: 160px;
            }
        }
        @media (max-height: 480px) {
            .signup-btn { top: calc(40% - 10px); font-size: 0.95rem; padding: 10px 20px; }
        }

        /* ================= 减少动态效果 ================= */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-delay: 0ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                transition-delay: 0ms !important;
            }
            .flow-line,
            .drift,
            .bg-field,
            .aura,
            .beam,
            .dot-field {
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">

                        <!-- 标题渐变（蓝紫，非纯色）

                            <stop offset="0.5" stop-color="#4f6bff"/>

                        <!-- 背景呼吸光晕（极低透明度，避免抢标题） -->

                    <!-- 底部流动波线（多条叠层） -->

        <!-- 下层区域 -->

                <!-- 报名按钮：位于背景与功能区分隔线正中；2026-11-26 00:00 后由脚本移除 -->
        <button class="signup-btn" id="signup-btn" type="button" onclick="openSignupModal()">干事报名</button>

        <!-- 报名弹窗 -->
        <div class="modal-mask" id="signup-modal" role="dialog" aria-modal="true"
             aria-labelledby="signup-title" onclick="if(event.target===this)closeSignupModal()">

                <div class="modal-text">下载报名表以向协会运营组织报名，我们期待你的到来！</div>

                <!-- 报名说明：数据收集截止时间与提交邮箱；过期后随按钮一并移除 -->
                <div class="modal-notice" id="signup-notice">
                    <p>报名说明</p>

                    <p>请将报名表发送邮件至：</p>
                    <span class="notice-mail">csustbc@foxmail.com</span>
                </div>

                    <span>&#128229;</span>

    <script>
        var boxes = Array.prototype.slice.call(document.querySelectorAll('.option-box'));
        var previewEl = document.getElementById('preview');
        var optionsArea = document.querySelector('.options-area');
        var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        // 协会风采使用的四张缩略图
        var introImages = [
            'Intro/thumbs/01.jpg',
            'Intro/thumbs/02.jpg',
            'Intro/thumbs/03.jpg',
            'Intro/thumbs/IMG_20260602_183137.jpg'
        ];

        function motionOff() {
            return reducedMotion.matches;
        }

        // ---------- 预览内容模板 ----------
        function buildIntroHTML() {
            return '<div class="dept-list">' +
                       '<span>裁判队</span>' +
                       '<span>协会办公室</span>' +
                       '<span>协会宣传组</span>' +
                       '<span>协会活动组</span>' +
                   '</div>';
        }

        function buildStyleHTML() {
            var html = '<div class="intro-grid">';
            introImages.forEach(function (src) {
                html += '<img src="' + src + '" alt="">';
            });
            html += '</div>';
            return html;
        }

        function buildRegisterHTML() {
            return '<div class="register-intro">' +
                       '<p>协会最新动态</p>' +
                       '<p>点击查看详讯</p>' +
                   '</div>';
        }

        // 统一包一层 .preview-inner，并记录 role，便于快速切换时判重
        function buildPreviewHTML(box) {
            if (!box) return '';
            var role = box.getAttribute('data-role');
            var inner = '';
            if (role === 'intro')    inner = buildIntroHTML();
            if (role === 'style')    inner = buildStyleHTML();
            if (role === 'register') inner = buildRegisterHTML();
            if (!inner) return '';
            return '<div class="preview-inner" data-role="' + role + '">' + inner + '</div>';
        }

        // ---------- 预览切换 ----------
        // 用 Web Animations API 控制外层退场（可被下一次切换直接打断），
        // 入场与内部错落则交给 CSS 自动播放，快速悬停时不会留下计时器残影。
        var PREVIEW_OUT_MS = 200;
        var RESET_OUT_MS = 160;
        var switchToken = 0;

        function cancelAnimations(el) {
            if (el && typeof el.getAnimations === 'function') {
                el.getAnimations().forEach(function (anim) { anim.cancel(); });
            }
        }

        function switchPreview(box) {
            var token = ++switchToken;
            var current = previewEl.querySelector('.preview-inner');
            var nextHTML = buildPreviewHTML(box);
            var nextRole = box ? box.getAttribute('data-role') : '';

            if (!nextHTML) return;

            // 已处于同一内容：只取消可能正在进行的退场，恢复到基础样式
            if (current && current.getAttribute('data-role') === nextRole) {
                cancelAnimations(current);
                return;
            }

            function mount() {
                if (token !== switchToken) return;
                previewEl.innerHTML = nextHTML;
            }

            if (!current || motionOff() || typeof current.animate !== 'function') {
                if (current) cancelAnimations(current);
                mount();
                return;
            }

            cancelAnimations(current);
            var out = current.animate(
                [
                    { opacity: 1, transform: 'translateY(0) scale(1)' },
                    { opacity: 0, transform: 'translateY(-10px) scale(0.985)' }
                ],
                {
                    duration: PREVIEW_OUT_MS,
                    easing: 'cubic-bezier(0.4, 0, 1, 1)',
                    fill: 'forwards'
                }
            );
            out.finished.then(mount, function () { /* 被新的切换取消 */ });
        }

        function resetPreview() {
            var token = ++switchToken;
            var current = previewEl.querySelector('.preview-inner');
            if (!current) return;

            cancelAnimations(current);

            if (motionOff() || typeof current.animate !== 'function') {
                previewEl.innerHTML = '';
                return;
            }

            var out = current.animate(
                [
                    { opacity: 1, transform: 'translateY(0) scale(1)' },
                    { opacity: 0, transform: 'translateY(8px) scale(0.99)' }
                ],
                {
                    duration: RESET_OUT_MS,
                    easing: 'cubic-bezier(0.4, 0, 1, 1)',
                    fill: 'forwards'
                }
            );
            out.finished.then(function () {
                if (token === switchToken) previewEl.innerHTML = '';
            }, function () { /* 被新的切换取消 */ });
        }

        // ---------- 选中逻辑 ----------
        function setSelected(box) {
            boxes.forEach(function (b) { b.classList.remove('selected'); });
            if (box) box.classList.add('selected');
        }

        // 跳转到"协会介绍"二级页面
        function goToIntro(el) {
            setSelected(el);
            window.location.href = 'intro.html';
        }

        // 跳转到"协会风采"二级页面（长理理工杯）
        function goToStyle(el) {
            setSelected(el);
            window.location.href = 'Senrio/highlights.html';
        }

        // 跳转到"协会动态"二级页面
        function goToRegister(el) {
            setSelected(el);
            window.location.href = 'News/news.html';
        }

        // ---------- 干事报名弹窗 ----------
        var modalEl = document.getElementById('signup-modal');
        var lastFocused = null;

        function openSignupModal() {
            if (!modalEl) return;
            stopAuto();
            lastFocused = document.activeElement;
            modalEl.classList.add('open');
            var download = modalEl.querySelector('.modal-download');
            if (download) {
                setTimeout(function () { download.focus(); }, 80);
            }
        }

        function closeSignupModal() {
            if (!modalEl || !modalEl.classList.contains('open')) return;
            modalEl.classList.remove('open');
            if (lastFocused && typeof lastFocused.focus === 'function') {
                lastFocused.focus();
            }
            if (!document.hidden && !optionsArea.matches(':hover')) {
                startAuto(false);
            }
        }

                // 按 Esc 关闭弹窗
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeSignupModal();
        });

                // ---------- 报名时限：2026-11-26 00:00 之后，报名按钮及其控件从主页移除 ----------
        // 说明：截止后不是“置灰不可点”，而是把报名按钮、报名说明、弹窗一并从 DOM 中删除，
        //       主页上不再出现任何与报名相关的控件。
        // 截止时间只在报名说明里以文字体现，主页不设单独的时限控件。
        (function signupDeadline() {
            var DEADLINE = new Date(2026, 10, 26, 0, 0, 0);   // 注意：月份从 0 开始，10 表示 11 月

            var signupBtn = document.getElementById('signup-btn');
            var noticeEl = document.getElementById('signup-notice');

            // 从主页彻底移除报名相关的全部控件
            function removeSignupUI() {
                if (deadlineTimer) clearTimeout(deadlineTimer);
                // 弹窗若正开着，先关掉；并避免关闭逻辑把焦点交还给已删除的按钮
                if (modalEl) {
                    modalEl.classList.remove('open');
                    lastFocused = null;
                }
                [signupBtn, noticeEl, modalEl].forEach(function (el) {
                    if (el && el.parentNode) el.parentNode.removeChild(el);
                });
            }

            var deadlineTimer = null;

            function scheduleRemoval() {
                var left = DEADLINE.getTime() - Date.now();
                if (left <= 0) {
                    removeSignupUI();
                    return;
                }
                // 到点那一刻再执行一次移除
                deadlineTimer = setTimeout(scheduleRemoval, Math.min(left, 2147483647));
            }

            scheduleRemoval();
        })();

        // ---------- 悬停 / 键盘焦点交互 ----------
        boxes.forEach(function (box) {
            box.addEventListener('mouseenter', function () {
                stopAuto();
                setSelected(box);
                switchPreview(box);
            });
            box.addEventListener('mouseleave', function () {
                if (!autoRunning) {
                    setSelected(null);
                    resetPreview();
                }
            });
            box.addEventListener('focus', function () {
                stopAuto();
                setSelected(box);
                switchPreview(box);
            });
            box.addEventListener('blur', function () {
                if (!autoRunning) {
                    setSelected(null);
                    resetPreview();
                }
            });
            box.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    box.click();
                }
            });
        });

        // ---------- 自动轮播 ----------
        // DOM 使用 row-reverse，视觉从左到右依次为 index 2, 1, 0
        var autoOrder = [2, 1, 0];
        var autoStep = 0;
        var autoRunning = false;
        var HOLD_MS = 3200;      // 每项停留
        var GAP_MS = 700;        // 中间留白（缩短空白，节奏更连贯）
        var autoTimer = null;

        function stopAuto() {
            autoRunning = false;
            if (autoTimer) {
                clearTimeout(autoTimer);
                autoTimer = null;
            }
        }

        function runAutoStep() {
            if (!autoRunning) return;
            var box = boxes[autoOrder[autoStep]];
            setSelected(box);
            switchPreview(box);

            autoTimer = setTimeout(function () {
                if (!autoRunning) return;
                setSelected(null);
                resetPreview();

                autoTimer = setTimeout(function () {
                    if (!autoRunning) return;
                    autoStep = (autoStep + 1) % autoOrder.length;
                    runAutoStep();
                }, GAP_MS);
            }, HOLD_MS);
        }

        function startAuto(resetStep) {
            stopAuto();
            autoRunning = true;
            if (resetStep) autoStep = 0;
            runAutoStep();
        }

        function queueAutoStart(delay) {
            stopAuto();
            autoTimer = setTimeout(function () { startAuto(true); }, delay);
        }

        // 鼠标进入选项区：暂停轮播并保留当前预览
        optionsArea.addEventListener('mouseenter', stopAuto);
        optionsArea.addEventListener('mouseleave', function () {
            setSelected(null);
            resetPreview();
            startAuto(true);
        });

        // 页面不可见时停止计时，回来后从当前项继续
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) {
                stopAuto();
            } else if (!optionsArea.matches(':hover')) {
                startAuto(false);
            }
        });

        // 入场动画基本结束后再开始轮播，避免与标题/选项框抢戏；
        // 减少动态效果时只静态展示第一项，不做自动切换。
        if (motionOff()) {
            setSelected(boxes[autoOrder[0]]);
            switchPreview(boxes[autoOrder[0]]);
        } else {
            queueAutoStart(1900);
        }

        // ---------- 背景 SVG 自适应：竖屏/窄屏避免裁掉 Logo 与标题 ----------
        var heroSvg = document.getElementById('hero-svg');
        var heroBox = document.querySelector('.top-layer');

        function fitHeroSvg() {
            if (!heroSvg || !heroBox) return;
            var w = heroBox.clientWidth;
            var h = heroBox.clientHeight;
            // 内容宽高比约 1440:486 ≈ 2.96
            var boxRatio = w / h;
            if (boxRatio < 2.2) {
                // 竖屏 / 窄屏：完整显示整幅横幅（Logo + 标题都在可视区内）
                heroSvg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            } else {
                // 宽屏：铺满容器，左右裁切装饰线条
                heroSvg.setAttribute('preserveAspectRatio', 'xMidYMid slice');
            }
        }

        fitHeroSvg();
        window.addEventListener('resize', fitHeroSvg);
        window.addEventListener('orientationchange', fitHeroSvg);

        // ---------- 竖屏访问时，跳转到竖屏专用首页 ----------
        (function redirectPortrait() {
            var isPortrait = window.matchMedia('(orientation: portrait)').matches;
            var isNarrow = window.matchMedia('(max-width: 820px)').matches;
            if (isPortrait && isNarrow) {
                // 用 replace，避免返回时又跳回来形成死循环
                window.location.replace('index-portrait.html');
            }
        })();
    </script>
</body>
</html>

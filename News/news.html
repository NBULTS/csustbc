<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#287ee3">
    <title>协会动态 · 长理羽协</title>
    <style>
        /* 引入本地字体 */
        @font-face {
            font-family: "MyFont";
            src: url("../zh-cn.woff2") format("woff2"),
                 url("../zh-cn-subset.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;               /* 禁止页面滚动 */
            font-family: "MyFont", "Microsoft YaHei", Arial, sans-serif;
        }

        /* ================= 关键帧动画 ================= */

        /* 上层 SVG 区域淡入 */
        @keyframes heroFade {
            from { opacity: 0; transform: scale(1.04) translateZ(0); }
            to   { opacity: 1; transform: scale(1)    translateZ(0); }
        }

        /* 下层整体从下方滑入 */
        @keyframes slideUp {
            from { transform: translateY(60px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* 动态条目错落出现 */
        @keyframes cardIn {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* 页面容器：使用动态视口高度适配移动端地址栏 */
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ================= 顶部：细标题栏（不再有大块壁纸背景区） ================= */

        .topbar {
            position: relative;
            flex: 0 0 auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #1f3a8a 0%, #287ee3 55%, #7a4fe0 100%);
            animation: heroFade 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* 标题文字 */
        .hero-title {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 返回按钮 */
        .back-btn {
            flex: 0 0 auto;
            padding: 8px 18px;
            font-size: 0.95rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: background 0.25s ease, padding-right 0.25s ease;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.55);
            padding-right: 24px;
        }

        /* ================= 卡片区：占据剩余全部空间 ================= */

        .entries {
            flex: 1 1 auto;                 /* 占满标题栏之外的剩余空间 */
            min-height: 0;                  /* 允许内部滚动 */
            background: #287ee3;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            padding: 20px 28px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            gap: 16px;
            overflow-y: auto;               /* 内容较多时纵向滚动 */
            animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

                /* 单条动态卡片：直角风格；左侧日期 + 右侧内容 两栏布局 */
        .news-item {
            display: flex;
            flex-direction: row;
            align-items: stretch;           /* 让日期竖条与卡片等高 */
            gap: 0;
            padding: 0;                     /* 内边距移到右侧内容区 */
            background: #ffffff;
            border: 2px solid #d0d7de;
            border-radius: 0;
            /* 注意：卡片在纵向 flex 容器里必须禁止被压缩，
               否则内容一多就会被压矮，配合 overflow:hidden 会出现“吃字” */
            flex: 0 0 auto;
            min-height: -moz-fit-content;
            min-height: fit-content;
            overflow: visible;              /* 不再裁切文字，改由子元素控制圆角/背景 */
            animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            /* 新闻内容一律使用系统字体（不使用站内自建字体） */
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB",
                         "Heiti SC", "WenQuanYi Micro Hei", Arial, sans-serif;
        }

        /* 左侧日期竖条需要溢出裁切时，由自身负责，不影响右侧文字 */
        .news-item > .news-date {
            overflow: hidden;
        }

        /* 左侧日期竖条：独立整条色带，与卡片等高，日期文字垂直居中 */
        .news-item .news-date {
            flex: 0 0 auto;
            width: 104px;
            display: flex;
            align-items: center;            /* 垂直居中 */
            justify-content: center;        /* 水平居中 */
            padding: 12px 10px;
            background: linear-gradient(180deg, #1f3a8a 0%, #287ee3 100%);
            color: #ffffff;
            font-size: 0.98rem;
            font-weight: bold;
            letter-spacing: 0.06em;
            line-height: 1.5;
            text-align: center;
            word-break: break-all;          /* 窄条时日期可折行 */
        }

        /* 右侧内容区 */
        .news-item .news-body {
            flex: 1 1 auto;
            min-width: 0;                   /* 允许内容换行，防止撑破 */
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;        /* 内容少时垂直居中 */
            gap: 8px;
            padding: 22px 26px;
            /* 文字不被任何父级裁切 */
            overflow: visible;
        }

        .news-item .news-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #1f3a8a;
            line-height: 1.5;
        }

        .news-item .news-desc {
            font-size: 1rem;
            color: #555;
            line-height: 1.6;
        }

        /* 可点开的动态（带图片）：整卡可点，提示可展开详情 */
        .news-item.is-clickable {
            cursor: pointer;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .news-item.is-clickable:hover {
            border-color: #287ee3;
            box-shadow: 0 6px 18px rgba(31, 58, 138, 0.16);
        }

        /* “查看图片”提示条 */
        .news-item .news-more {
            display: inline-block;
            align-self: flex-start;
            margin-top: 4px;
            padding: 4px 12px;
            font-size: 0.86rem;
            font-weight: bold;
            color: #287ee3;
            border: 1px solid rgba(40, 126, 227, 0.45);
            background: rgba(40, 126, 227, 0.07);
            user-select: none;
        }

        /* 图片网格：默认收起，点开卡片才显示；一排两张 */
        .news-item .news-gallery {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
            padding-top: 12px;
            border-top: 1px dashed #c8d5e6;
        }

        .news-item.is-open .news-gallery {
            display: grid;
            animation: galleryIn 0.35s ease both;
        }

        @keyframes galleryIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 正方形格子，图片等比裁切填满，两张高度一致 */
        .news-item .news-gallery img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #f2f5fa;
            border: 1px solid #d0d7de;
            cursor: zoom-in;
        }

        /* 图片区底部小提示 */
        .news-item .news-tip {
            grid-column: 1 / -1;
            font-size: 0.82rem;
            color: #8794a5;
            text-align: right;
        }

        /* 点图片查看大图的遮罩层 */
        .photo-mask {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(10, 18, 40, 0.9);
        }

        .photo-mask.is-open { display: flex; }

        .photo-mask img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        /* 重要提示（红字）：系统字体渲染 */
        .news-item .news-note {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #e0b4b4;
            font-size: 0.95rem;
            font-weight: bold;
            color: #d21f1f;
            line-height: 1.7;
        }

        /* 空状态提示 */
        .news-empty {
            color: #ffffff;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
            opacity: 0.9;
        }

        /* ================================================================
           移动端适配（手机竖屏 / 横屏 / 触屏）
           ================================================================ */

        body { -webkit-tap-highlight-color: transparent; }

        /* 触屏：去掉 hover 位移，避免点击残留 */
        @media (hover: none) {
            .back-btn:hover { padding-right: 18px; background: rgba(0, 0, 0, 0.28); }
        }

        /* 平板 / 窄桌面 */
        @media (max-width: 720px) {
            .topbar { padding: 12px 16px; }
            .hero-title { font-size: 1.35rem; }
            .entries { padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); gap: 14px; }
            .news-item .news-body { padding: 18px 20px; }
            .news-item .news-date { width: 88px; font-size: 0.92rem; }
            .news-item .news-title { font-size: 1.2rem; }
        }

        /* 手机竖屏 */
        @media (max-width: 480px) {
            .topbar { padding: 10px 14px; }
            .hero-title { font-size: 1.2rem; letter-spacing: 0.06em; }
            .back-btn { padding: 7px 12px; font-size: 0.85rem; }

            .entries { padding: 12px 14px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); gap: 12px; }
            .news-item .news-body { padding: 16px 16px; }
            .news-item .news-date { width: 68px; font-size: 0.8rem; letter-spacing: 0; padding: 10px 6px; }
            .news-item .news-title { font-size: 1.1rem; }
            .news-item .news-desc { font-size: 0.92rem; }
            .news-item .news-note { font-size: 0.9rem; }
        }

        /* 极窄屏（小屏手机）再压一档 */
        @media (max-width: 360px) {
            .hero-title { font-size: 1.05rem; }
            .back-btn   { font-size: 0.78rem; padding: 6px 10px; }
            .news-item .news-date { width: 58px; font-size: 0.74rem; padding: 8px 4px; }
            .news-item .news-title { font-size: 1.02rem; }
        }

        /* 横屏手机（矮屏）：标题栏更紧凑，卡片区仍尽量大 */
        @media (max-height: 480px) {
            .topbar { padding: 8px 16px; }
            .hero-title { font-size: 1.1rem; }
            .entries { padding: 12px 20px; gap: 10px; }
            .news-item .news-body { padding: 14px 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部：细标题栏 -->
        <div class="topbar">
            <div class="hero-title">长理羽协 · 协会动态</div>
            <div class="back-btn" onclick="window.location.href='../index.html'">返回首页 &rarr;</div>
        </div>

        <!-- 卡片区：占据剩余全部空间 -->
        <div class="entries" id="news-list">
            <!-- 动态条目由下方脚本渲染；此处为占位，暂无内容时显示提示 -->
            <div class="news-empty">暂无最新动态，敬请期待……</div>
        </div>
    </div>

    <!-- 点击图片查看大图的遮罩层 -->
    <div class="photo-mask" id="photo-mask">
        <img src="" alt="协会活动照片">
    </div>

    <script>
        // ============================================================
        // 协会动态数据：后续新增动态，只需在此数组追加条目即可。
        // 字段：date（日期）、title（标题）、desc（简介）
        // 可选：note（红字提示）、photos（图片路径列表，图片放在同目录 photos/ 下）
        //       带 photos 的条目默认收起，点击卡片才展开图片
        // ============================================================
                var NEWS = [
            {
                date: '2026-11-25',
                title: '干事报名数据收集即将截止！',
                desc: '干事报名数据收集将于 2026 年 11 月 26 日 0:00 截止：' +
                      '请下载报名表并完整填写个人信息后，将报名表发送邮件至 csustbc@foxmail.com。' +
                      '逾期提交、或向非指定渠道提交的报名表，一律不予统计。',
                note: '注意！过期不候，不要向其他源提交，向其他源提交的一律不入数据库！'
            },
            {
                date: '2026-11-22',
                title: '协会纳新已顺利结束！',
                desc: '协会纳新已顺利结束，感谢大家的支持和捧场！' +
                      '已经加入的同学请留意会员群内的后续通告，谢谢！'
            },
            {
                date: '2026-11-22',
                title: '协会纳新顺利进行！',
                desc: '学生社团百团大战顺利举行，协会在百团大战现场顺利开展招新活动，' +
                      '已吸纳超 200 个新成员，感谢大家的支持！',
                photos: [
                    'photos/01.jpg',
                    'photos/02.jpg',
                    'photos/03.jpg',
                    'photos/04.jpg'
                ]
            },
            {
                date: '2026-11-18',
                title: '长沙理工大学学生社团百团大战即将开始！',
                desc: '百团大战于 2026 年 11 月 21 至 22 日举行：第一天在金盆岭的西田径场，' +
                      '第二天在云塘汀香园前坪，我们欢迎各位来到活动现场！',
                note: '注意，社团纳新仅限于百团大战期间，我们不会借招新的名义明示或暗示收取费用！' +
                      '下载的报名表请按照会员群内的通知，在规定的时间内向指定的接收方提交！' +
                      '协会站点只是一个信息站，不具有社团招新的信息上传功能！'
            },
            {
                date: '2026-10-15',
                title: '协会宣传网站已建成',
                desc: '协会的宣传网站已建成，欢迎各位在 GitHub 仓库的 Issue 中提出问题，' +
                      '或向 notebookunited@outlook.com 发送邮件反馈信息。'
            }
        ];

        // 大图遮罩
        var photoMask = document.getElementById('photo-mask');
        var photoMaskImg = photoMask.querySelector('img');

        function openPhoto(src) {
            photoMaskImg.src = src;
            photoMask.classList.add('is-open');
        }

        function closePhoto() {
            photoMask.classList.remove('is-open');
            photoMaskImg.src = '';
        }

        photoMask.addEventListener('click', closePhoto);
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closePhoto();
        });

        (function renderNews() {
            if (!NEWS.length) return;   // 无数据时保留占位提示
            var listEl = document.getElementById('news-list');
            listEl.innerHTML = '';
            // 按日期降序排列：最新的消息排在顶部
            var sorted = NEWS.slice().sort(function (a, b) {
                return a.date > b.date ? -1 : (a.date < b.date ? 1 : 0);
            });
            sorted.forEach(function (item, i) {
                var el = document.createElement('div');
                el.className = 'news-item';
                el.style.animationDelay = (0.3 + i * 0.1) + 's';

                // 右侧内容区 HTML（标题、简介、红字提示、图片网格）
                var bodyHtml =
                    '<span class="news-title">' + item.title + '</span>' +
                    '<span class="news-desc">' + item.desc + '</span>';
                if (item.note) {
                    bodyHtml += '<span class="news-note">' + item.note + '</span>';
                }
                // 带图片的动态：默认收起，点击卡片才展开
                var hasPhotos = !!(item.photos && item.photos.length);
                if (hasPhotos) {
                    el.classList.add('is-clickable');
                    bodyHtml += '<span class="news-more">点击查看相关图片</span>' +
                                '<div class="news-gallery">' +
                                item.photos.map(function (src, idx) {
                                    return '<img src="' + src + '" alt="' + item.title +
                                           ' 现场图片 ' + (idx + 1) + '" loading="lazy">';
                                }).join('') +
                                '<span class="news-tip">点击图片可查看大图</span>' +
                                '</div>';
                }

                // 左侧日期 + 右侧内容 两栏结构
                el.innerHTML =
                    '<div class="news-date">' + item.date + '</div>' +
                    '<div class="news-body">' + bodyHtml + '</div>';

                if (hasPhotos) {
                    el.addEventListener('click', function (e) {
                        // 点图片先放大查看，其余区域切换展开/收起
                        if (e.target && e.target.tagName === 'IMG') {
                            e.stopPropagation();
                            openPhoto(e.target.getAttribute('src'));
                            return;
                        }
                        var opened = el.classList.toggle('is-open');
                        var more = el.querySelector('.news-more');
                        if (more) more.textContent = opened ? '收起图片' : '点击查看相关图片';
                    });
                }
                listEl.appendChild(el);
            });
        })();
    </script>
</body>
</html>

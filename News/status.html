<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#287ee3">
    <title>报名状态查询 · 长理羽协</title>
    <style>
        @font-face {
            font-family: "MyFont";
            src: url("../zh-cn.woff2") format("woff2"),
                 url("../zh-cn-subset.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: "MyFont", "Microsoft YaHei", Arial, sans-serif;
        }

        @keyframes heroFade {
            from { opacity: 0; transform: scale(1.04) translateZ(0); }
            to   { opacity: 1; transform: scale(1)    translateZ(0); }
        }

        @keyframes slideUp {
            from { transform: translateY(60px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        @keyframes cardIn {
            from { transform: translateY(24px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ================= 顶部标题栏 ================= */
        .topbar {
            position: relative;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #1f3a8a 0%, #287ee3 55%, #7a4fe0 100%);
            animation: heroFade 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .hero-title {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 0.1em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .back-btn {
            flex: 0 0 auto;
            padding: 8px 18px;
            font-size: 0.95rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: background 0.25s ease, padding-right 0.25s ease;
        }

        .back-btn:hover { background: rgba(0, 0, 0, 0.55); padding-right: 24px; }

        /* ================= 内容区 ================= */
        .panel {
            flex: 1 1 auto;
            min-height: 0;
            background: #287ee3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 28px;
            padding-bottom: calc(24px + env(safe-area-inset-bottom));
            gap: 18px;
            overflow-y: auto;
            animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        /* 查询卡片 */
        .query-card {
            width: 100%;
            max-width: 560px;
            flex: 0 0 auto;
            background: #ffffff;
            border: 2px solid #d0d7de;
            padding: 26px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB",
                         "Heiti SC", "WenQuanYi Micro Hei", Arial, sans-serif;
            animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .query-card .card-lead {
            font-size: 0.98rem;
            color: #555;
            line-height: 1.7;
        }

        .field { display: flex; flex-direction: column; gap: 6px; }

        .field label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #1f3a8a;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            font-size: 1rem;
            font-family: inherit;
            color: #222;
            background: #f7f9fc;
            border: 1px solid #c3cedb;
            border-radius: 0;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .field input:focus {
            border-color: #287ee3;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(40, 126, 227, 0.14);
        }

        .field input.is-error { border-color: #d21f1f; background: #fff6f6; }

        .submit-btn {
            margin-top: 4px;
            padding: 13px 20px;
            font-size: 1.05rem;
            font-weight: bold;
            font-family: inherit;
            color: #ffffff;
            background: linear-gradient(135deg, #1f3a8a 0%, #287ee3 100%);
            border: none;
            cursor: pointer;
            letter-spacing: 0.08em;
            transition: filter 0.2s ease, transform 0.1s ease;
        }

        .submit-btn:hover  { filter: brightness(1.12); }
        .submit-btn:active { transform: translateY(1px); }

        /* ================= 结果区 ================= */
        .result {
            display: none;
            width: 100%;
            max-width: 560px;
            flex: 0 0 auto;
            background: #ffffff;
            border: 2px solid #d0d7de;
            border-left: 10px solid #287ee3;
            padding: 22px 26px;
            flex-direction: column;
            gap: 10px;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB",
                         "Heiti SC", "WenQuanYi Micro Hei", Arial, sans-serif;
            animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .result.is-open { display: flex; }

        .result .result-head {
            font-size: 1.15rem;
            font-weight: bold;
            color: #1f3a8a;
        }

        .result .result-row {
            display: flex;
            gap: 10px;
            font-size: 0.98rem;
            color: #444;
            line-height: 1.7;
        }

        .result .result-row .k {
            flex: 0 0 auto;
            min-width: 92px;
            color: #7a8698;
        }

        .result .result-row .v { flex: 1 1 auto; word-break: break-all; }

        /* 状态徽标 */
        .badge {
            display: inline-block;
            padding: 3px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.04em;
            border: 1px solid transparent;
        }

        .badge.ok       { color: #1a7f37; background: #e8f6ec; border-color: #a9d8b5; }
        .badge.pending  { color: #9a6700; background: #fff8e1; border-color: #e6d4a0; }
        .badge.unknown  { color: #8b1f1f; background: #fdeeee; border-color: #e7b4b4; }

        .result .result-note {
            margin-top: 6px;
            padding-top: 10px;
            border-top: 1px dashed #c8d5e6;
            font-size: 0.9rem;
            color: #555;
            line-height: 1.75;
        }

        .result .result-note strong { color: #d21f1f; }

        /* 页脚说明 */
        .foot-note {
            max-width: 560px;
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.86rem;
            line-height: 1.8;
            text-align: center;
            padding-bottom: 6px;
        }

        /* ================= 移动端适配 ================= */
        body { -webkit-tap-highlight-color: transparent; }

        @media (hover: none) {
            .back-btn:hover { padding-right: 18px; background: rgba(0, 0, 0, 0.28); }
        }

        @media (max-width: 720px) {
            .topbar { padding: 12px 16px; }
            .hero-title { font-size: 1.35rem; }
            .panel { padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); gap: 14px; }
            .query-card { padding: 22px 20px; }
        }

        @media (max-width: 480px) {
            .topbar { padding: 10px 14px; }
            .hero-title { font-size: 1.2rem; letter-spacing: 0.06em; }
            .back-btn { padding: 7px 12px; font-size: 0.85rem; }

            .panel { padding: 12px 14px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); gap: 12px; }
            .query-card { padding: 18px 16px; gap: 14px; }
            .query-card .card-lead { font-size: 0.92rem; }
            .field input { padding: 11px 12px; font-size: 0.98rem; }
            .submit-btn { font-size: 1rem; padding: 12px 16px; }
            .result { padding: 18px 16px; border-left-width: 8px; }
            .result .result-head { font-size: 1.06rem; }
            .result .result-row { font-size: 0.94rem; }
            .result .result-row .k { min-width: 76px; }
        }

        @media (max-width: 360px) {
            .hero-title { font-size: 1.05rem; }
            .back-btn { font-size: 0.78rem; padding: 6px 10px; }
            .result .result-row { flex-direction: column; gap: 2px; }
        }

        @media (max-height: 480px) {
            .topbar { padding: 8px 16px; }
            .hero-title { font-size: 1.1rem; }
            .panel { padding: 12px 20px; gap: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div class="hero-title">长理羽协 · 报名状态查询</div>
            <div class="back-btn" onclick="window.location.href='news.html'">返回动态 &rarr;</div>
        </div>

        <div class="panel">
            <div class="query-card">
                <div class="card-lead">
                    请输入你的<strong>姓名</strong>和<strong>电话后四位</strong>查询报名表的入库状态。
                </div>

                <div class="field">
                    <label for="input-name">姓名</label>
                    <input id="input-name" type="text" inputmode="text"
                           autocomplete="name" placeholder="请输入你的姓名" maxlength="20">
                </div>

                <div class="field">
                    <label for="input-phone">电话后四位</label>
                    <input id="input-phone" type="text" inputmode="numeric"
                           autocomplete="off" placeholder="例如 1234" maxlength="4">
                </div>

                <button class="submit-btn" id="btn-query" type="button">查询我的状态</button>
            </div>

            <!-- 查询结果 -->
            <div class="result" id="result">
                <div class="result-head" id="result-head"></div>
                <div id="result-body"></div>
                <div class="result-note" id="result-note"></div>
            </div>

            <div class="foot-note" id="foot-note">
                数据更新时间：<span id="updated-at">加载中……</span>
            </div>
        </div>
    </div>

    <!-- 查询数据：独立文件，更新数据只需替换此文件，无需改动本页面 -->
    <script>
        // ============================================================
        // 报名状态查询
        // 数据来源：data/register-status.json（由汇总脚本在本地算好生成）
        //
        // 【隐私设计】数据文件里【不含任何明文身份信息】，只有：
        //   { updated, algo: 'sha256', salt, depts: [部门名...],
        //     items: [ { h: 索引, i: 部门下标, a: 1已入库/0未入库 } ] }
        // 索引 = SHA256(salt + 姓名 + 分隔符 + 电话后四位)，全部由 Python 端算好。
        // 浏览器只做两件事：对用户自己输入的内容算一次 SHA256，然后等值比对。
        //   1. 数据文件被整份下载，也拿不到报名者名单；
        //   2. 姓名与电话后四位必须同时正确才能命中，无法只枚举姓名撞库；
        //   3. 命中后只回显用户自己输入的内容，不泄露他人信息；
        //   4. 部门名单独放字典，条目只存下标，不构成“一人一行”的可读记录。
        //
        // 状态只有两种：已入库 / 未入库。
        // “未归档 / 未提交 / 协会已向你回信”只是未入库的可能性，写进提示文案，不单独展示。
        // ============================================================
        var DATA_URL = 'data/register-status.json';
        var MIN_INTERVAL = 800;    // 简易限流：两次查询最小间隔（毫秒）

        var nameInput  = document.getElementById('input-name');
        var phoneInput = document.getElementById('input-phone');
        var resultEl   = document.getElementById('result');
        var headEl     = document.getElementById('result-head');
        var bodyEl     = document.getElementById('result-body');
        var noteEl     = document.getElementById('result-note');
        var btnEl      = document.getElementById('btn-query');

        var cacheData = null;      // 缓存查询数据，避免重复请求
        var lastClick = 0;

        function getData() {
            if (cacheData) return Promise.resolve(cacheData);
            return fetch(DATA_URL, { cache: 'no-store' })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (data) { cacheData = data; return data; });
        }

        function normalize(text) {
            return (text || '').trim().replace(/\s+/g, '');
        }

        function escapeHtml(text) {
            return String(text == null ? '' : text)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // 用浏览器内置 WebCrypto 计算 SHA-256。
        // GitHub Pages 为 HTTPS，crypto.subtle 必定可用；
        // 若极少数环境不可用（如本地 file:// 打开），明确提示而不降级到错误实现。
        function sha256Hex(text) {
            if (!(window.crypto && window.crypto.subtle &&
                  typeof window.crypto.subtle.digest === 'function')) {
                return Promise.reject(new Error('WEBCRYPTO_UNAVAILABLE'));
            }
            return window.crypto.subtle
                .digest('SHA-256', new TextEncoder().encode(text))
                .then(function (buf) {
                    return Array.prototype.map.call(new Uint8Array(buf),
                        function (b) { return ('0' + b.toString(16)).slice(-2); }
                    ).join('');
                });
        }

        // 索引 = SHA256(salt + \x1f + 姓名 + \x1f + 电话后四位)
        // 必须与 generate_excel.py 的 make_fingerprint() 完全一致
        function makeFingerprint(salt, name, tail) {
            return sha256Hex(salt + '\x1f' + name + '\x1f' + tail);
        }

        function row(label, value) {
            return '<div class="result-row"><span class="k">' + escapeHtml(label) +
                   '</span><span class="v">' + value + '</span></div>';
        }

        function showResult(html, headHtml, noteHtml) {
            headEl.innerHTML = headHtml;
            bodyEl.innerHTML = html || '';
            noteEl.innerHTML = noteHtml || '';
            noteEl.style.display = noteHtml ? '' : 'none';
            resultEl.classList.add('is-open');
            resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // 未入库：统一一条说明，三种成因只作为可能性并列，不单独拆分展示
        var PENDING_NOTE =
            '你的报名表<strong>尚未入库</strong>。可能的情况包括：' +
            '我们尚未收到你的报名表；报名表信息不完整（如未填写姓名）；' +
            '或协会已就你的报名表向你回信。<br>' +
            '请检查邮箱与 QQ 消息，或联系 csustbc@foxmail.com 确认。';

        function doQuery() {
            // 简易限流：防止脚本高频撞库
            var now = Date.now();
            if (now - lastClick < MIN_INTERVAL) return;
            lastClick = now;

            var name  = normalize(nameInput.value);
            var phone = normalize(phoneInput.value).replace(/\D/g, '');

            nameInput.classList.remove('is-error');
            phoneInput.classList.remove('is-error');

            if (!name) {
                nameInput.classList.add('is-error');
                showResult('', '请先填写姓名',
                    '姓名请与报名表中填写的<strong>完全一致</strong>，不要填写网名或昵称。');
                nameInput.focus();
                return;
            }
            if (phone.length !== 4) {
                phoneInput.classList.add('is-error');
                showResult('', '电话后四位格式不正确',
                    '请输入<strong>4 位数字</strong>，例如“1234”。');
                phoneInput.focus();
                return;
            }

            getData().then(function (data) {
                var salt = data && data.salt;
                if (!salt) throw new Error('BAD_DATA');
                return makeFingerprint(salt, name, phone)
                    .then(function (fp) {
                        var items = (data && data.items) || [];
                        var depts = (data && data.depts) || [];
                        var hit = null;
                        for (var i = 0; i < items.length; i++) {
                            if (items[i].h === fp) { hit = items[i]; break; }
                        }

                        if (!hit) {
                            showResult('', '未查询到你的报名记录',
                                '可能的原因：<br>' +
                                '1. 报名表<strong>尚未收到</strong>，或尚未完成归档；<br>' +
                                '2. 姓名或电话后四位与报名表不一致（请勿填写网名）；<br>' +
                                '3. 报名表<strong>未填写姓名</strong>等关键信息，暂时无法匹配。<br>' +
                                '如有疑问，请联系 csustbc@foxmail.com。'
                            );
                            return;
                        }

                        // 已入库：只回显用户自己输入的内容
                        if (hit.a === 1) {
                            var dept = (hit.i >= 0 && depts[hit.i]) ? depts[hit.i] : '待定';
                            showResult(
                                row('姓名', escapeHtml(name)) +
                                row('电话后四位', escapeHtml(phone)) +
                                row('归档部门', escapeHtml(dept) + '（第一志愿）') +
                                row('当前状态', '<span class="badge ok">已入库</span>'),
                                '查询成功 · 已入库',
                                '你的报名表<strong>已归档</strong>，部门以第一志愿为准。' +
                                '后续安排请留意会员群通知。'
                            );
                            return;
                        }

                        // 未入库：徽标统一显示“未入库”
                        showResult(
                            row('姓名', escapeHtml(name)) +
                            row('电话后四位', escapeHtml(phone)) +
                            row('当前状态', '<span class="badge pending">未入库</span>'),
                            '查询成功 · 未入库',
                            PENDING_NOTE
                        );
                });
            }).catch(function (err) {
                if (err && err.message === 'WEBCRYPTO_UNAVAILABLE') {
                    showResult('', '当前环境不支持安全查询',
                        '请通过协会站点的正式网址（HTTPS）访问本页面，' +
                        '不要在本地直接双击打开文件。');
                    return;
                }
                showResult('', '数据加载失败',
                    '请检查网络后重试，或稍后再访问本页面。');
            });
        }

        btnEl.addEventListener('click', doQuery);

        // 回车即查询
        [nameInput, phoneInput].forEach(function (el) {
            el.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') doQuery();
            });
        });

        // 显示数据更新时间
        getData().then(function (data) {
            document.getElementById('updated-at').textContent =
                (data && data.updated) ? data.updated : '未知';
        }).catch(function () {
            document.getElementById('updated-at').textContent = '未知';
        });
    </script>
</body>
</html>

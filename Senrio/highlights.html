<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>协会风采 · 长理理工杯</title>
    <style>
        /* 引入本地字体 */
        @font-face {
            font-family: "MyFont";
            src: url("../zh-cn.woff2") format("woff2"),
                 url("../zh-cn-subset.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: "MyFont", "Microsoft YaHei", Arial, sans-serif;
            background: #f9fbfd;
        }

        /* ================= 关键帧动画 ================= */

        /* 主图缓慢放大淡入 */
        @keyframes imageFadeIn {
            from { transform: scale(1.08) translateZ(0); opacity: 0; }
            to   { transform: scale(1)    translateZ(0); opacity: 1; }
        }

        /* 主图文字：上浮淡入 */
        @keyframes titleUp {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* 内容块滑入 */
        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* 图片错落淡入 */
        @keyframes fadeUp {
            from { transform: translateY(24px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        /* 顶部标题栏：从上方滑入 */
        @keyframes barSlideDown {
            from { transform: translateY(-100%); }
            to   { transform: translateY(0); }
        }

        /* ================= 顶部主图（占 60% 高度） ================= */

        .hero {
            position: relative;
            height: 60vh;
            width: 100%;
            overflow: hidden;               /* 裁剪放大溢出的部分 */
            display: flex;
            align-items: center;            /* 文字垂直居中 */
            justify-content: center;        /* 文字水平居中 */
        }

                .hero-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;              /* 铺满整个区域 */
            object-position: center;
            transform-origin: center center;
            backface-visibility: hidden;
            will-change: transform, opacity;
            animation: imageFadeIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        /* 协会日常主图：叠在上层，默认隐藏，切换时淡入 */
        .hero-img-daily {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0s linear 0.5s;
        }

                /* 切到协会日常时显示 RBAG */
        .hero.is-daily .hero-img-daily {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease;
        }

        /* RBAG 为宽幅横图：切换后让主图区降为横幅比例，避免过度裁切 */
        .hero.is-daily {
            height: 42vh;
        }


                /* 主图压暗遮罩，保证中间文字清晰可读 */
        .hero::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            pointer-events: none;
            transition: background 0.35s ease;
        }

        /* 协会日常：RBAG 为宽幅横图，压暗程度略降以保留细节 */
        .hero.is-daily::after {
            background: rgba(0, 0, 0, 0.22);
        }

        /* 图框正中央的“长理理工杯”文字 */
        .hero-title {
            position: relative;
            z-index: 2;
            color: #ffffff;
            font-size: 4.2rem;
            font-weight: bold;
            letter-spacing: 0.18em;
            text-indent: 0.18em;            /* 抵消尾部字距，使文字真正居中 */
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
            padding: 10px 28px;
                        border-top: 3px solid rgba(255, 255, 255, 0.9);
            border-bottom: 3px solid rgba(255, 255, 255, 0.9);
            animation: titleUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
        }

        /* 协会日常模式下主图文字：宽幅图较小字号，避免压盖画面 */
        .hero.is-daily .hero-title {
            font-size: 3.2rem;
        }

        /* ================= 顶部固定标题栏（主图滚出视野后显示） ================= */

        /* 默认隐藏，向上移出屏幕 */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;                    /* 宽度全占满 */
            height: 20vh;                   /* 占 0.2 的高度 */
            background: #287ee3;            /* 无文字位置由已有蓝色填充 */
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            transform: translateY(-100%);   /* 初始隐藏在屏幕上方 */
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }

        /* 主图不可见时：滑入显示 */
        .top-bar.show {
            transform: translateY(0);
            pointer-events: auto;
        }

        .top-bar .top-bar-text {
            font-size: 2.6rem;
            font-weight: bold;
            letter-spacing: 0.16em;
            text-indent: 0.16em;            /* 抵消尾部字距，使文字居中 */
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
        }

        /* ================= 内容区（占 40% 高度） ================= */

        .content {
            min-height: 40vh;
            padding: 36px 48px 56px;
            animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
        }

        /* 左下方：02.jpg + 右侧配文 */
        .feature {
            display: flex;
            align-items: center;            /* 图片与文字在同一水平行 */
            gap: 32px;
            margin-bottom: 48px;
        }

        .feature-img {
            width: 42%;                     /* 图片居左，占约 42% 宽 */
            flex-shrink: 0;
        }

        .feature-img img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
            border: 1px solid #d0d7de;
            background: #ffffff;
        }

        /* 右侧配文 */
        .feature-text {
            flex: 1;
        }

        .feature-text p {
            font-size: 1.35rem;
            line-height: 2;
            color: #333;
            text-align: justify;
            padding-left: 20px;
            border-left: 5px solid #287ee3;
        }

        /* ================= 剩余图片：两两一组 ================= */

        .section-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #287ee3;
            margin-bottom: 24px;
            padding-left: 14px;
            border-left: 6px solid #287ee3;
        }

        /* 「协会的运营团队」专属：字号更大、上下间距更宽 */
        .section-title.team-title {
            font-size: 2.2rem;
            margin-top: 72px;          /* 与上方内容拉开距离 */
            margin-bottom: 40px;       /* 与下方图片拉开距离 */
            padding-left: 18px;
            border-left-width: 8px;
        }

        .gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;   /* 每行两张 */
            gap: 20px;
        }

        .gallery figure {
            width: 100%;
            animation: fadeUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .gallery img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            border: 1px solid #d0d7de;
            background: #ffffff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery img:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 26px rgba(40, 126, 227, 0.28);
        }

        /* 左上角返回按钮 */
        .back-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 30;                    /* 位于顶部标题栏之上 */
            padding: 10px 20px;
            font-size: 1rem;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.5);
            cursor: pointer;
            user-select: none;
            transition: background 0.25s ease, padding-left 0.25s ease;
        }

        .back-btn:hover {
            background: rgba(0, 0, 0, 0.65);
            padding-left: 26px;
        }

                /* ================= 底部中央横栏（切换：活动 / 协会日常） ================= */

        .bottom-tabs {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);        /* 水平居中 */
            z-index: 25;
            display: flex;
            width: min(520px, calc(100% - 40px));
            background: #ffffff;
            border: 2px solid #287ee3;
            box-shadow: 0 8px 26px rgba(31, 58, 138, 0.28);
            overflow: hidden;
            user-select: none;
        }

        .bottom-tabs .tab-btn {
            flex: 1 1 50%;
            padding: 14px 10px;
            font-size: 1.05rem;
            font-weight: bold;
            text-align: center;
            color: #287ee3;
            background: #ffffff;
            border: none;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.08em;
            transition: background 0.25s ease, color 0.25s ease;
        }

        /* 左栏右侧分隔线 */
        .bottom-tabs .tab-btn:first-child {
            border-right: 2px solid #287ee3;
        }

        .bottom-tabs .tab-btn:hover {
            background: rgba(40, 126, 227, 0.08);
        }

        /* 选中态：蓝色实底、白字 */
        .bottom-tabs .tab-btn.active {
            background: #287ee3;
            color: #ffffff;
        }

        /* 面板显隐：默认只显示“活动” */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* 小屏适配：窄屏时内容纵向堆叠 */
        @media (max-width: 720px) {
            .hero-title { font-size: 2.4rem; }
            .top-bar .top-bar-text { font-size: 1.6rem; }
            .content { padding: 24px 20px 96px; }
            .feature { flex-direction: column; }
            .feature-img { width: 100%; }
                        .gallery { grid-template-columns: 1fr; }
            .bottom-tabs { bottom: 16px; }
            .bottom-tabs .tab-btn { padding: 12px 8px; font-size: 0.98rem; }
            .hero.is-daily { height: 32vh; }
            .hero.is-daily .hero-title { font-size: 1.9rem; letter-spacing: 0.1em; text-indent: 0.1em; }
        }
    </style>
</head>
<body>
    <!-- 返回按钮 -->
    <div class="back-btn" onclick="window.location.href='../index.html'">&larr; 返回首页</div>

    <!-- 顶部固定标题栏：主图滚出视野后显示 -->
    <div class="top-bar" id="topBar">
        <span class="top-bar-text">长理理工杯风采</span>
    </div>

        <!-- 顶部主图：占 60% 高度，图框正中央显示“长理理工杯” -->
    <div class="hero" id="hero">
        <img class="hero-img" id="heroImgActivity" src="thumbs/01.jpg" alt="理工杯主题图">
        <img class="hero-img hero-img-daily" id="heroImgDaily" src="thumbs/RBAG.jpg" alt="协会日常主题图">
        <div class="hero-title" id="heroTitle">长理理工杯</div>
    </div>


        <!-- 内容区 -->
    <div class="content">
        <!-- 面板一：活动 -->
        <div class="tab-panel active" id="panelActivity">
            <!-- 左下方 02.jpg + 右侧配文 -->
            <div class="feature">
                <div class="feature-img">
                    <img src="thumbs/02.jpg" alt="理工杯现场">
                </div>
                <div class="feature-text">
                    <p>理工杯是一年一度的校级羽毛球竞赛，各个学院或学院联队均会参赛，一决高下</p>
                </div>
            </div>

            <!-- 剩余图片：两两一组显示 -->
            <div class="section-title" id="sectionHighlights">精彩瞬间</div>
            <div class="gallery" id="gallery"></div>
        </div>

        <!-- 面板二：协会日常 -->
        <div class="tab-panel" id="panelDaily">
            <!-- 协会的运营团队：两两一组显示 -->
            <div class="section-title team-title" id="sectionTeam">协会的运营团队</div>
            <div class="gallery" id="teamGallery"></div>
        </div>
    </div>

    <!-- 底部中央横栏：左“活动” / 右“协会日常” -->
    <div class="bottom-tabs" id="bottomTabs">
        <button type="button" class="tab-btn active" data-target="panelActivity">活动</button>
        <button type="button" class="tab-btn" data-target="panelDaily">协会日常</button>
    </div>


    <script>
        // 剩余图片（来自 Senrio 目录，已生成缩略图），两两一组展示
        var galleryImages = [
            'thumbs/D1_1.jpg',
            'thumbs/D1_2.jpg',
            'thumbs/D1_4.jpg',
            'thumbs/D1_5.jpg',
            'thumbs/D1_6.jpg',
            'thumbs/D2_1.jpg',
            'thumbs/D2_9.jpg',
            'thumbs/D2_10.jpg',
            'thumbs/D2_11.jpg',
            'thumbs/D2_12.jpg',
            'thumbs/D2_13.jpg',
            'thumbs/D2_14.jpg',
            'thumbs/D2_15.jpg',
            'thumbs/D_16.jpg'
        ];

        (function buildGallery() {
            var gallery = document.getElementById('gallery');
            var html = '';
            galleryImages.forEach(function (src, i) {
                // 依次错落延迟，让图片逐个出现
                var delay = (0.5 + i * 0.06).toFixed(2);
                html += '<figure style="animation-delay:' + delay + 's">' +
                            '<img src="' + src + '" alt="理工杯精彩瞬间">' +
                        '</figure>';
            });
            gallery.innerHTML = html;
        })();

        // 协会的运营团队图片（Senrio 目录中以 P 开头的图片，已生成缩略图），两两一组展示
        var teamImages = [
            'thumbs/P_1.jpg',
            'thumbs/P_2.jpg',
            'thumbs/P_3.jpg',
            'thumbs/P_4.jpg',
            'thumbs/P_5.jpg',
            'thumbs/P_6.jpg',
            'thumbs/P_7.jpg',
            'thumbs/P_8.jpg'
        ];

        (function buildTeamGallery() {
            var gallery = document.getElementById('teamGallery');
            var html = '';
            teamImages.forEach(function (src, i) {
                var delay = (0.5 + i * 0.06).toFixed(2);
                html += '<figure style="animation-delay:' + delay + 's">' +
                            '<img src="' + src + '" alt="协会运营团队">' +
                        '</figure>';
            });
            gallery.innerHTML = html;
        })();

                // 主图滚出视野后，显示顶部固定标题栏；标题文字随当前选中的面板切换
        (function initScrollTopBar() {
            var hero = document.querySelector('.hero');
            var topBar = document.getElementById('topBar');
            var topBarText = topBar ? topBar.querySelector('.top-bar-text') : null;

            var DEFAULT_TITLE = '长理理工杯风采';
            var DAILY_TITLE = '协会日常';

            function updateTopBar() {
                if (!hero || !topBar) return;

                // 主图完全滚出视野（底部 <= 0）时显示标题栏
                var heroBottom = hero.getBoundingClientRect().bottom;
                if (heroBottom <= 0) {
                    topBar.classList.add('show');
                } else {
                    topBar.classList.remove('show');
                }

                // 标题文字：选中“协会日常”面板时显示对应标题
                if (topBarText) {
                    var dailyActive = document.getElementById('panelDaily')
                        .classList.contains('active');
                    var title = dailyActive ? DAILY_TITLE : DEFAULT_TITLE;
                    if (topBarText.textContent !== title) {
                        topBarText.textContent = title;
                    }
                }
            }

            window.addEventListener('scroll', updateTopBar, { passive: true });
            window.addEventListener('resize', updateTopBar);

            // 供切换标签时调用
            window.__updateTopBar = updateTopBar;
            updateTopBar();
        })();

                // 底部横栏：切换“活动 / 协会日常”
        (function initBottomTabs() {
            var tabs = document.getElementById('bottomTabs');
            if (!tabs) return;
            var buttons = tabs.querySelectorAll('.tab-btn');
            var hero = document.getElementById('hero');
            var heroTitle = document.getElementById('heroTitle');

            var HERO_TITLES = {
                panelActivity: '长理理工杯',
                panelDaily: '协会日常'
            };

            buttons.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    var targetId = btn.getAttribute('data-target');
                    if (btn.classList.contains('active')) return;   // 重复点击忽略

                    // 按钮选中态
                    buttons.forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');

                    // 面板显隐
                    document.querySelectorAll('.tab-panel').forEach(function (p) {
                        p.classList.remove('active');
                    });
                    var target = document.getElementById(targetId);
                    if (target) target.classList.add('active');

                    // 顶部主图切换：协会日常 → RBAG
                    var isDaily = (targetId === 'panelDaily');
                    if (hero) hero.classList.toggle('is-daily', isDaily);
                    if (heroTitle) heroTitle.textContent = HERO_TITLES[targetId] || HERO_TITLES.panelActivity;

                    // 切换后滚回顶部，让主图与内容从头展示
                    window.scrollTo({ top: 0, behavior: 'smooth' });

                    // 更新顶部标题栏文字
                    if (typeof window.__updateTopBar === 'function') {
                        window.__updateTopBar();
                    }
                });
            });
        })();


    </script>
</body>
</html>
